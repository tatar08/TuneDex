        '409': { description: 'IDEMPOTENCY_KEY_REUSED or IDEMPOTENCY_IN_PROGRESS (Retry-After: 1)', headers: { Retry-After: { schema: { type: integer } } }, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '413': { description: PAYLOAD_TOO_LARGE (body over 128 KiB), content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '429': { description: 'API_RATE_LIMITED: details.scope = device_batches with retryAfterSeconds 60 (10 batches a minute per device), or the account''s 30 writes a minute', headers: { Retry-After: { schema: { type: integer } } }, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
