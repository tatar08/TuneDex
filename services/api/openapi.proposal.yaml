# COL-01 contract PROPOSAL for COL-00 review (Codex owns the shared copy in packages/api_contracts).
# Nothing here is locked until both sides agree; the API in this folder implements exactly this.
openapi: 3.1.0
info:
  title: TuneDeck API
  version: 0.1.0-proposal
servers:
  - url: /
paths:
  /health/live:
    get:
      summary: Process is running
      security: []
      responses:
        '200': { description: Live, content: { application/json: { schema: { $ref: '#/components/schemas/Health' } } } }
  /health/ready:
    get:
      summary: Process can serve traffic (database reachable)
      security: []
      responses:
        '200': { description: Ready, content: { application/json: { schema: { $ref: '#/components/schemas/Health' } } } }
        '503': { description: Not ready, content: { application/json: { schema: { $ref: '#/components/schemas/Health' } } } }
  /v1/me/settings:
    get:
      summary: Read the signed-in account's settings
      responses:
        '200':
          description: Current settings. A new account gets defaults at revision 0.
          headers:
            ETag: { schema: { type: string, example: '"3"' }, description: Quoted revision }
          content: { application/json: { schema: { $ref: '#/components/schemas/SettingsView' } } }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
    patch:
      summary: Change some settings (compare-and-set on revision)
      parameters:
        - name: If-Match
          in: header
          required: true
          description: The revision the client last read, quoted, e.g. "3". Use "0" before the first save.
          schema: { type: string, pattern: '^"\d{1,15}"$' }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/SettingsPatch' } } }
      responses:
        '200':
          description: Saved; revision incremented by one
          headers: { ETag: { schema: { type: string } } }
          content: { application/json: { schema: { $ref: '#/components/schemas/SettingsView' } } }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '412': { $ref: '#/components/responses/Error' }
        '413': { $ref: '#/components/responses/Error' }
        '428': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /v1/me/devices:
    get:
      summary: List the signed-in account's devices
      responses:
        '200':
          description: Devices, active first then most recently seen, with the current settings revision for comparison
          content: { application/json: { schema: { $ref: '#/components/schemas/DeviceList' } } }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /v1/me/devices/{deviceId}:
    put:
      summary: Device check-in (registers on first call)
      parameters:
        - { $ref: '#/components/parameters/DeviceId' }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/DeviceReport' } } }
      responses:
        '200':
          description: Recorded
          content: { application/json: { schema: { $ref: '#/components/schemas/Device' } } }
        '400': { description: 'Invalid field, or appliedSettingsRevision ahead of the server (details.reason = ahead_of_server)', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '401': { $ref: '#/components/responses/Error' }
        '403': { description: 'DEVICE_REVOKED (sign the app out) or account not active', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '409': { description: 'DEVICE_LIMIT, 20 active devices per account', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '503': { $ref: '#/components/responses/Error' }
  /v1/me/devices/{deviceId}/session:
    delete:
      summary: Revoke a device
      description: Requires the token's auth_time to be within the last 300 seconds.
      parameters:
        - { $ref: '#/components/parameters/DeviceId' }
      responses:
        '200':
          description: Revoked (repeat calls keep the first revokedAt)
          content: { application/json: { schema: { $ref: '#/components/schemas/Device' } } }
        '401': { description: 'Not signed in, or REAUTH_REQUIRED with details.maxAgeSeconds', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '404': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /v1/me/staff:
    get:
      summary: The caller's current staff roles
      responses:
        '200':
          description: Empty list for customers
          content: { application/json: { schema: { type: object, required: [roles], properties: { roles: { type: array, items: { type: string, enum: [support, catalog_editor, operator, admin, auditor] } } } } } }
        '401': { $ref: '#/components/responses/Error' }
  /v1/catalog/radio:
    get:
      summary: Public radio catalog (no sign-in)
      security: []
      parameters:
        - { name: cursor, in: query, schema: { type: string, maxLength: 64 }, description: Opaque; from nextCursor }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 50 } }
        - { name: If-None-Match, in: header, schema: { type: string } }
      responses:
        '200':
          description: Published, enabled stations with current rights, ordered by id
          headers:
            ETag: { schema: { type: string }, description: Weak ETag of the page }
            Cache-Control: { schema: { type: string, example: 'public, max-age=300' } }
          content: { application/json: { schema: { $ref: '#/components/schemas/CatalogPage' } } }
        '304': { description: Unchanged since If-None-Match }
        '400': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /v1/admin/stations:
    get:
      summary: List stations (catalog_editor, admin)
      responses:
        '200':
          description: Up to 500 stations by name
          content: { application/json: { schema: { type: object, required: [stations], properties: { stations: { type: array, items: { $ref: '#/components/schemas/AdminStation' } } } } } }
        '401': { $ref: '#/components/responses/Error' }
        '403': { description: ROLE_REQUIRED, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    post:
      summary: Create a station draft (catalog_editor, admin)
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/StationDraft' } } }
      responses:
        '201':
          description: Draft created at revision 1
          headers: { ETag: { schema: { type: string } } }
          content: { application/json: { schema: { $ref: '#/components/schemas/AdminStation' } } }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { description: ROLE_REQUIRED, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /v1/admin/stations/{stationId}:
    parameters:
      - { $ref: '#/components/parameters/StationId' }
    get:
      summary: Read one station (catalog_editor, admin)
      responses:
        '200':
          description: Station
          headers: { ETag: { schema: { type: string } } }
          content: { application/json: { schema: { $ref: '#/components/schemas/AdminStation' } } }
        '403': { description: ROLE_REQUIRED, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '404': { $ref: '#/components/responses/Error' }
    patch:
      summary: Edit the draft (catalog_editor, admin); the public catalog is unchanged until publish
      parameters:
        - { name: If-Match, in: header, required: true, schema: { type: string, pattern: '^"\d{1,15}"$' } }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/StationPatch' } } }
      responses:
        '200':
          description: Draft revision incremented (unchanged when the patch changes nothing)
          content: { application/json: { schema: { $ref: '#/components/schemas/AdminStation' } } }
        '400': { $ref: '#/components/responses/Error' }
        '403': { description: ROLE_REQUIRED, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '404': { $ref: '#/components/responses/Error' }
        '412': { $ref: '#/components/responses/Error' }
        '428': { $ref: '#/components/responses/Error' }
  /v1/admin/stations/{stationId}/publish:
    parameters:
      - { $ref: '#/components/parameters/StationId' }
    post:
      summary: Publish the reviewed draft revision (admin who did not change it)
      parameters:
        - { name: If-Match, in: header, required: true, description: The draft revision the admin reviewed, schema: { type: string } }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/Reason' } } }
      responses:
        '200':
          description: Published
          content: { application/json: { schema: { $ref: '#/components/schemas/AdminStation' } } }
        '403': { description: ROLE_REQUIRED, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '404': { $ref: '#/components/responses/Error' }
        '409': { description: 'PUBLISH_BLOCKED, details.reasons from own_change, already_published, rights_basis_missing, rights_reference_missing, rights_expired', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '412': { $ref: '#/components/responses/Error' }
        '428': { $ref: '#/components/responses/Error' }
  /v1/admin/stations/{stationId}/disable:
    parameters:
      - { $ref: '#/components/parameters/StationId' }
    post:
      summary: Hide from the public catalog (admin)
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/Reason' } } } }
      responses:
        '200': { description: Disabled, content: { application/json: { schema: { $ref: '#/components/schemas/AdminStation' } } } }
        '403': { description: ROLE_REQUIRED, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '404': { $ref: '#/components/responses/Error' }
  /v1/admin/stations/{stationId}/enable:
    parameters:
      - { $ref: '#/components/parameters/StationId' }
    post:
      summary: Return to the public catalog (admin)
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/Reason' } } } }
      responses:
        '200': { description: Enabled, content: { application/json: { schema: { $ref: '#/components/schemas/AdminStation' } } } }
        '403': { description: ROLE_REQUIRED, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '404': { $ref: '#/components/responses/Error' }
security:
  - bearer: []
components:
  securitySchemes:
    bearer: { type: http, scheme: bearer, bearerFormat: JWT, description: OIDC access token (iss/aud/exp/RS256 verified via JWKS) }
  parameters:
    StationId:
      name: stationId
      in: path
      required: true
      schema: { type: string, format: uuid }
    DeviceId:
      name: deviceId
      in: path
      required: true
      description: UUID the app generates once per install
      schema: { type: string, format: uuid }
  schemas:
    Health:
      type: object
      required: [status]
      properties: { status: { type: string, enum: [ok, unavailable] } }
    Settings:
      type: object
      additionalProperties: false
      required: [theme, language, cellularPolicy]
      properties:
        theme: { type: string, enum: [system, light, dark] }
        language: { type: string, enum: [th, en] }
        cellularPolicy: { type: string, enum: [allow, wifi_only] }
    SettingsPatch:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        theme: { type: string, enum: [system, light, dark] }
        language: { type: string, enum: [th, en] }
        cellularPolicy: { type: string, enum: [allow, wifi_only] }
    SettingsView:
      type: object
      required: [revision, schemaVersion, settings, updatedAt]
      properties:
        revision: { type: integer, minimum: 0 }
        schemaVersion: { type: integer, const: 1 }
        settings: { $ref: '#/components/schemas/Settings' }
        updatedAt: { type: [string, 'null'], format: date-time }
    DeviceReport:
      type: object
      additionalProperties: false
      required: [platform, osMajor, appBuild]
      properties:
        platform: { type: string, enum: [ios, android] }
        osMajor: { type: integer, minimum: 0, maximum: 99 }
        appBuild: { type: string, pattern: '^[0-9A-Za-z.+-]{1,32}$', example: '1.0.0+42' }
        appliedSettingsRevision: { type: integer, minimum: 0, default: 0 }
    Device:
      type: object
      required: [id, platform, osMajor, appBuild, appliedSettingsRevision, lastSeenAt, revokedAt]
      properties:
        id: { type: string, format: uuid }
        platform: { type: string, enum: [ios, android] }
        osMajor: { type: integer }
        appBuild: { type: string }
        appliedSettingsRevision: { type: integer }
        lastSeenAt: { type: string, format: date-time }
        revokedAt: { type: string, format: date-time, nullable: true }
    DeviceList:
      type: object
      required: [settingsRevision, devices]
      properties:
        settingsRevision: { type: integer }
        devices: { type: array, items: { $ref: '#/components/schemas/Device' } }
    StationDraft:
      type: object
      additionalProperties: false
      required: [name, country, language, streamUrl, codec]
      properties: &stationFields
        name: { type: string, minLength: 1, maxLength: 80 }
        country: { type: string, pattern: '^[A-Z]{2}$' }
        language: { type: string, pattern: '^[a-z]{2,3}$' }
        genres: { type: array, maxItems: 5, items: { type: string, pattern: '^[a-z0-9-]{2,24}$' } }
        streamUrl: { type: string, format: uri, maxLength: 2048, description: 'https only, port 443, public host name; never fetched by the API' }
        codec: { type: string, enum: [mp3, aac, hls] }
        bitrateKbps: { type: integer, minimum: 8, maximum: 512, nullable: true }
        rightsBasis: { type: string, enum: [owner_permission, broadcaster_terms, licensed_aggregator, owned_demo], nullable: true }
        rightsReference: { type: string, maxLength: 200, nullable: true, description: Where the evidence is kept, not the evidence }
        rightsExpiresAt: { type: string, format: date, nullable: true }
    StationPatch:
      type: object
      additionalProperties: false
      minProperties: 1
      properties: *stationFields
    Reason:
      type: object
      additionalProperties: false
      required: [reason]
      properties: { reason: { type: string, minLength: 1, maxLength: 500 } }
    AdminStation:
      type: object
      required: [id, revision, status, draft, published, publishedRevision, publishedAt, disabledAt, updatedAt, publishBlockers]
      properties:
        id: { type: string, format: uuid }
        revision: { type: integer }
        status: { type: string, enum: [draft, published, changes_pending, disabled] }
        draft: { $ref: '#/components/schemas/StationDraft' }
        published: { allOf: [{ $ref: '#/components/schemas/StationDraft' }], nullable: true }
        publishedRevision: { type: integer, nullable: true }
        publishedAt: { type: string, format: date-time, nullable: true }
        disabledAt: { type: string, format: date-time, nullable: true }
        updatedAt: { type: string, format: date-time }
        publishBlockers: { type: array, items: { type: string }, description: Why the caller could not publish now; empty when they can }
    PublicStation:
      type: object
      required: [id, revision, name, country, language, genres, streamUrl, codec, bitrateKbps]
      properties:
        id: { type: string, format: uuid }
        revision: { type: integer }
        name: { type: string }
        country: { type: string }
        language: { type: string }
        genres: { type: array, items: { type: string } }
        streamUrl: { type: string, format: uri }
        codec: { type: string, enum: [mp3, aac, hls] }
        bitrateKbps: { type: integer, nullable: true }
    CatalogPage:
      type: object
      required: [stations, nextCursor]
      properties:
        stations: { type: array, items: { $ref: '#/components/schemas/PublicStation' } }
        nextCursor: { type: string, nullable: true }
    Error:
      type: object
      required: [code, messageKey, requestId, details]
      properties:
        code:
          type: string
          enum: [AUTH_REQUIRED, AUTH_FORBIDDEN, VALIDATION_FAILED, NOT_FOUND, PRECONDITION_REQUIRED, REVISION_MISMATCH, PAYLOAD_TOO_LARGE, REAUTH_REQUIRED, DEVICE_REVOKED, DEVICE_LIMIT, ROLE_REQUIRED, PUBLISH_BLOCKED, DEPENDENCY_UNAVAILABLE, INTERNAL]
        messageKey: { type: string, example: errors.settings.revisionMismatch }
        requestId: { type: string }
        details:
          type: object
          description: 'No tokens or PII. VALIDATION_FAILED → {field?, reason, allowed?}; REVISION_MISMATCH → {currentRevision}; REAUTH_REQUIRED → {maxAgeSeconds}; DEVICE_LIMIT → {maxActiveDevices}; PUBLISH_BLOCKED → {reasons}.'
  responses:
    Error:
      description: Error envelope
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
