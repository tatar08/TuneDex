        '401': { $ref: '#/components/responses/Error' }
        '403': { description: 'ACCOUNT_DELETING, AUTH_FORBIDDEN or DEVICE_REVOKED', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '404': { description: 'NOT_FOUND: unknown, another account''s, already withdrawn, expired or not a UUID', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '409': { description: 'IDEMPOTENCY_KEY_REUSED or IDEMPOTENCY_IN_PROGRESS (Retry-After: 1)', headers: { Retry-After: { schema: { type: integer } } }, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '429': { description: 'API_RATE_LIMITED, 30 writes a minute per account; details.retryAfterSeconds', headers: { Retry-After: { schema: { type: integer } } }, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '503': { $ref: '#/components/responses/Error' }
  /v1/sync/push:
    post:
      summary: Push favorite changes (Doc 06 account sync, R1 scope)
      description: |
        Up to 100 changes, validated as a whole first (a malformed change refuses the whole request with its field path), then applied in order under one lock per account; each change gets its own result.
        `baseRevision` 0 creates the entity; otherwise it must equal the current revision. `delete` and `restore` need `baseRevision` ≥ 1. A delete wins over stale updates; only `restore` naming the tombstone's revision brings an entity back, and a create can never reuse an existing or deleted `entityId`. One live favorite per station.
        A replayed `changeId` with the same content returns its first result; the same `changeId` with different content is `rejected` / `change_id_reused`. Replay records are kept 90 days.
        With `deviceId`, the device must be registered to the caller and not revoked, and its `lastSyncedAt` is recorded. Body limit 64 KiB. Responses carry `Cache-Control: no-store`.
      parameters:
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/SyncPushRequest' } } }
      responses:
        '200':
          description: One result per change, in request order (HTTP 200 even when some changes conflict or are rejected)
          headers:
            Cache-Control: { schema: { type: string, example: no-store } }
          content: { application/json: { schema: { $ref: '#/components/schemas/SyncPushResponse' } } }
        '400': { description: 'VALIDATION_FAILED with details.field (e.g. changes[3].value.order) and details.reason: must_be_object, unknown_field, must_be_uuid, must_be_non_empty_array, too_many (over 100), duplicate_in_request, unsupported (type or op), must_be_non_negative_integer, must_name_current_revision (delete/restore with baseRevision 0), not_allowed_on_delete, out_of_range (order), malformed_body (bad JSON); or an Idempotency-Key of the wrong format', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '401': { $ref: '#/components/responses/Error' }
        '403': { description: 'DEVICE_REVOKED (deviceId revoked, or the token''s session belongs to a revoked device), ACCOUNT_DELETING, or AUTH_FORBIDDEN (account not active)', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '404': { description: 'NOT_FOUND, details {field: deviceId, reason: device_not_registered}', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '409': { description: 'IDEMPOTENCY_KEY_REUSED, or IDEMPOTENCY_IN_PROGRESS with Retry-After: 1', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '413': { description: 'PAYLOAD_TOO_LARGE, body over 64 KiB', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '429':
          description: API_RATE_LIMITED (30 writes a minute per account), details.retryAfterSeconds
          headers: { Retry-After: { schema: { type: integer } } }
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '503': { $ref: '#/components/responses/Error' }
  /v1/sync/pull:
    get:
      summary: Changes and tombstones after a cursor, oldest first
      description: |
        No cursor (or an empty one) means a full reconciliation from the start, which is always allowed. Save the returned `cursor` only after applying the page locally; when `hasMore` is true, pull again with it.
        Tombstones and replay records are kept 90 days; a cursor from before the account's purged horizon is 410 SYNC_RESET_REQUIRED (pull again without a cursor).
        With `deviceId`, the device must be registered to the caller and not revoked, and its `lastSyncedAt` is recorded. Any other query parameter is refused. Responses carry `Cache-Control: no-store`.
      parameters:
        - { name: cursor, in: query, schema: { type: string, pattern: '^[A-Za-z0-9_-]{0,32}$' }, description: Opaque; the cursor of the previous page }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 50 } }
        - { name: deviceId, in: query, schema: { type: string, format: uuid }, description: 'The calling device, to record its last sync' }
      responses:
        '200':
          description: One page
          headers:
            Cache-Control: { schema: { type: string, example: no-store } }
          content: { application/json: { schema: { $ref: '#/components/schemas/SyncPullPage' } } }
        '400': { description: 'VALIDATION_FAILED: cursor malformed, limit out_of_range, deviceId must_be_uuid, or unknown_field (any other query parameter)', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '401': { $ref: '#/components/responses/Error' }
        '403': { description: 'DEVICE_REVOKED (deviceId revoked, or the token''s session belongs to a revoked device), ACCOUNT_DELETING, or AUTH_FORBIDDEN', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '404': { description: 'NOT_FOUND, details {field: deviceId, reason: device_not_registered}', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '410': { description: 'SYNC_RESET_REQUIRED: the cursor is older than the purged horizon; pull again without a cursor', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '429':
          description: API_RATE_LIMITED (120 reads a minute per account), details.retryAfterSeconds
          headers: { Retry-After: { schema: { type: integer } } }
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '503': { $ref: '#/components/responses/Error' }
  /v1/me/favorites:
    get:
      summary: The live favorites with their revisions, in order (for the web page)
      description: 'Ordered by `order`, then `entityId`. Read-only; changes go through POST /v1/sync/push. `Cache-Control: no-store`.'
      responses:
        '200':
          description: Live favorites (no tombstones)
          headers:
            Cache-Control: { schema: { type: string, example: no-store } }
          content: { application/json: { schema: { $ref: '#/components/schemas/SyncFavoriteList' } } }
        '401': { $ref: '#/components/responses/Error' }
        '403': { description: 'ACCOUNT_DELETING, AUTH_FORBIDDEN or DEVICE_REVOKED', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '429':
          description: API_RATE_LIMITED, details.retryAfterSeconds
          headers: { Retry-After: { schema: { type: integer } } }
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '503': { $ref: '#/components/responses/Error' }
  /v1/me/entitlements:
    get:
      summary: Pro per store and the account's purchases
      description: 'Store-scoped in R1, a purchase on one store unlocks Pro in that store''s app only. Per store the best state wins (verified > pending > revoked > none). Purchases are listed oldest first. `Cache-Control: no-store`.'
      responses:
        '200':
          description: Entitlements
          headers:
            Cache-Control: { schema: { type: string, example: no-store } }
          content: { application/json: { schema: { $ref: '#/components/schemas/BillingEntitlements' } } }
        '401': { $ref: '#/components/responses/Error' }
        '403': { description: 'ACCOUNT_DELETING, AUTH_FORBIDDEN or DEVICE_REVOKED', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '429':
          description: API_RATE_LIMITED, details.retryAfterSeconds
          headers: { Retry-After: { schema: { type: integer } } }
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '503': { $ref: '#/components/responses/Error' }
  /v1/billing/verify:
    post:
      summary: Send the store's proof after a purchase or restore
      description: |
        Apple: the JWS is verified offline against the pinned Apple root (x5c chain of 3, validity, Apple marker extensions, ES256), then bundle id, Pro product id and environment are checked. Google: the Play Developer API is asked as the service account; a purchased (not pending) purchase is acknowledged after it is stored.
        `appAccountToken` (Apple) or `obfuscatedExternalAccountId` (Google), when set, must be the caller's account id (the `userId` of GET /v1/me). One purchase belongs to one live account; a purchase of a deleted account moves to the account sending it. A revoked purchase stays revoked whatever a later verify says (the answer is then 200 with `state: revoked`). Idempotent: the same proof again returns the stored state.
        Audited `purchase.verified` / `purchase.pending` / `purchase.revoked` when the state or owner changes. Body limit 64 KiB. `Cache-Control: no-store`.
      parameters:
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/BillingVerifyRequest' } } }
      responses:
        '200':
          description: The stored purchase (state verified, pending or revoked)
          headers:
            Cache-Control: { schema: { type: string, example: no-store } }
          content: { application/json: { schema: { $ref: '#/components/schemas/BillingPurchase' } } }
        '400': { description: 'VALIDATION_FAILED (details.field: body, store unsupported, signedTransaction must_be_jws, productId / purchaseToken invalid, unknown_field), or PURCHASE_INVALID with details.reason: signature, wrong_app, unknown_product, environment, malformed, account_mismatch (Apple); unknown_product, unknown_purchase, cancelled, account_mismatch (Google)', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '401': { $ref: '#/components/responses/Error' }
        '403': { description: 'ACCOUNT_DELETING, AUTH_FORBIDDEN or DEVICE_REVOKED', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '409': { description: 'PURCHASE_CONFLICT (the purchase belongs to another live account), IDEMPOTENCY_KEY_REUSED, or IDEMPOTENCY_IN_PROGRESS with Retry-After: 1', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '413': { description: 'PAYLOAD_TOO_LARGE, body over 64 KiB', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '429':
          description: API_RATE_LIMITED (30 writes a minute per account), details.retryAfterSeconds
          headers: { Retry-After: { schema: { type: integer } } }
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '503': { description: 'DEPENDENCY_UNAVAILABLE: that store is not configured, or the Google API could not be reached; nothing new is granted', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /v1/webhooks/apple:
    post:
      summary: App Store Server Notifications V2 (called by Apple)
      description: |
        No user token: `signedPayload` (and the `signedTransactionInfo` inside it) is verified like a transaction against the pinned Apple root, and the notification's bundle id must match. Redeliveries are recognized by `notificationUUID` and answered 200 without work. `REFUND` and `REVOKE` revoke the purchase (audited `purchase.revoked` by `system:apple`); `REFUND_REVERSED` whose transaction carries no `revocationDate` makes a revoked purchase verified again (audited `purchase.restored`). Other types and unknown purchases change nothing. A notification whose `data.environment` is not in `APPLE_ENVIRONMENTS` is answered 200 and changes nothing. Handled ids are kept 30 days. Not rate limited. Body limit 64 KiB.
      security: []
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/BillingAppleNotification' } } }
      responses:
        '200': { description: 'Accepted (also for redeliveries and notification types that change nothing)', content: { application/json: { schema: { $ref: '#/components/schemas/BillingWebhookAck' } } } }
        '400': { description: 'VALIDATION_FAILED (signedPayload must_be_jws, malformed_body), or PURCHASE_INVALID wrong_app (bundle id mismatch or no notificationUUID)', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '401': { description: 'AUTH_REQUIRED: the signed payload or transaction did not verify, or Apple billing is not configured (answered the same way so a caller cannot tell)', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '413': { description: 'PAYLOAD_TOO_LARGE, body over 64 KiB', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /v1/webhooks/google:
    post:
      summary: Play real-time developer notifications via Pub/Sub push (called by Google)
      description: |
        No user token. `Authorization: Bearer <Google OIDC token>` that Pub/Sub attaches: RS256, issuer accounts.google.com, audience `GOOGLE_PUBSUB_PUSH_AUDIENCE`, `email` = `GOOGLE_PUBSUB_PUSH_SERVICE_ACCOUNT` with `email_verified: true`. `message.data` is the base64 notification JSON and its `packageName` must match. Redeliveries are recognized by `message.messageId` (kept 30 days) and answered 204 without work.
        A voided purchase is revoked; a pending purchase that completes (oneTimeProductNotification type 1) is re-checked with the Play API, verified and acknowledged; a pending one cancelled (type 2) is revoked. Anything else (test notifications included) is accepted without change. Not rate limited. Body limit 64 KiB.
      security: []
      parameters:
        - { name: Authorization, in: header, required: true, description: 'Bearer <Google-signed OIDC token from Pub/Sub push>, not a TuneDeck access token', schema: { type: string } }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/BillingPubSubPush' } } }
      responses:
        '204': { description: Accepted (also for redeliveries and notifications that change nothing) }
        '400': { description: 'VALIDATION_FAILED (message malformed, message.data malformed, malformed_body), or PURCHASE_INVALID wrong_app (packageName mismatch)', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '401': { description: 'AUTH_REQUIRED: missing or invalid Pub/Sub token (also when Google''s keys cannot be fetched, or Google billing is not configured)', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '413': { description: 'PAYLOAD_TOO_LARGE, body over 64 KiB', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '503': { description: 'DEPENDENCY_UNAVAILABLE: the Play API could not be reached while completing a pending purchase (the notification is retried by redelivery)', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /v1/config:
    get:
      summary: Signed remote config for the apps (no sign-in)
      description: |
        The newest release on the channel whose targets fit the client, else the built-in defaults as release 0. A client that sends no `platform` only gets releases aimed at every platform and build; one that sends `platform` without `build` only gets releases without a build range.
        `jws` is a compact JWS (protected header `alg: EdDSA` (Ed25519), `kid`, `typ: tunedeck-config+jws`) whose payload is the same document without `jws`. Apps must verify it with the pinned public key and act only on its payload. A release past its `expiresAt` is still served: apps then fall back to their built-in defaults.
        Unknown query parameters are ignored. Not rate limited.
      security: []
      parameters:
        - { name: channel, in: query, schema: { type: string, enum: [production, staging], default: production }, description: staging is for internal test builds }
        - { name: platform, in: query, schema: { type: string, enum: [ios, android] } }
        - { name: build, in: query, schema: { type: integer, minimum: 1, maximum: 2147483647 }, description: 'Build number, digits only without leading zero; needs platform' }
        - { name: If-None-Match, in: header, schema: { type: string }, description: 'The ETag from an earlier answer, compared exactly' }
      responses:
        '200':
          description: The signed document
          headers:
            ETag: { schema: { type: string, example: '"r12-AbCdEfGhIjKlMnOp"' }, description: 'Strong; "r<release>-<kid>", or "d-<channel>-<kid>" for the defaults' }
            Cache-Control: { schema: { type: string, example: 'public, max-age=300' }, description: no-cache in the dev environment }
          content: { application/json: { schema: { $ref: '#/components/schemas/ConfigDocument' } } }
        '304':
          description: Unchanged since If-None-Match
          headers:
            ETag: { schema: { type: string } }
            Cache-Control: { schema: { type: string } }
        '400': { description: 'VALIDATION_FAILED: channel / platform value_not_allowed, build must_be_build_number, platform required (build without platform)', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '503': { $ref: '#/components/responses/Error' }
  /v1/catalog/radio:
    get:
      summary: Public radio catalog (no sign-in)
      description: Published, enabled stations whose rights have not expired, ordered by id. Only the published snapshot is served, never a draft or rights details. Unknown query parameters are ignored.
      security: []
      parameters:
        - { name: cursor, in: query, schema: { type: string, pattern: '^[A-Za-z0-9_-]{0,64}$' }, description: Opaque; from nextCursor. Empty means the first page }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 50 }, description: 'Up to 3 digits; the server serves 0 as 1 and 101-999 as 100 rather than refusing them' }
        - { name: If-None-Match, in: header, schema: { type: string }, description: 'The ETag from an earlier answer, compared exactly' }
      responses:
        '200':
          description: One page
          headers:
            ETag: { schema: { type: string, example: 'W/"3q2-7wXbG1ZkQ0aYk1u9mJm5sQ8nXz"' }, description: Weak ETag of the page }
            Cache-Control: { schema: { type: string, example: 'public, max-age=300' } }
          content: { application/json: { schema: { $ref: '#/components/schemas/CatalogPage' } } }
        '304':
          description: Unchanged since If-None-Match
          headers:
            ETag: { schema: { type: string } }
            Cache-Control: { schema: { type: string, example: 'public, max-age=300' } }
        '400': { description: 'VALIDATION_FAILED: cursor malformed, limit out_of_range (not 1-3 digits)', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '429':
          description: API_RATE_LIMITED (60 a minute per client address), details.retryAfterSeconds
          headers: { Retry-After: { schema: { type: integer } } }
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '503': { $ref: '#/components/responses/Error' }
  /v1/admin/stations:
    get:
      summary: List stations, one cursor page by name then id (catalog_editor, admin)
      description: 'Roles: catalog_editor or admin. Every /v1/admin route also needs a staff session that signed in with MFA in the last 12 hours. Cache-Control: no-store.'
      parameters:
        - { name: cursor, in: query, schema: { type: string, pattern: '^[A-Za-z0-9_-]{1,1024}$' }, description: Opaque; from nextCursor }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 50 } }
        - { name: q, in: query, schema: { type: string, minLength: 1, maxLength: 80 }, description: 'Part of the draft name, any case; % and _ are plain characters. Trimmed; blank after trimming is 400' }
        - { name: status, in: query, schema: { type: string, enum: [draft, published, changes_pending, disabled] }, description: Only stations with this status }
      responses:
        '200':
          description: One page of stations, each with its stream health
          headers: { Cache-Control: { schema: { type: string, example: no-store } } }
          content: { application/json: { schema: { $ref: '#/components/schemas/AdminStationPage' } } }
        '400': { description: 'VALIDATION_FAILED: details.field limit (out_of_range, max), cursor (malformed), q (out_of_range, max 80) or status (invalid)', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '401': { description: 'AUTH_REQUIRED, or MFA_REQUIRED with details {scope: session, maxAgeSeconds: 43200} when this Keycloak session did not sign in with MFA in the last 12 hours', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '403': { description: 'ROLE_REQUIRED: needs catalog_editor or admin', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    post:
      summary: Create a station draft (catalog_editor, admin)
      description: 'Roles: catalog_editor or admin. The creator is recorded as a draft author, so they cannot publish it without the emergency flag. Audited as station.create.'
      parameters:
        - { name: Idempotency-Key, in: header, required: false, description: 'Optional. A repeat with the same body within 24 hours gets the first response again (Idempotent-Replayed: true)', schema: { type: string, pattern: '^[A-Za-z0-9_.:-]{8,128}$' } }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/StationDraft' } } }
      responses:
        '201':
          description: Draft created at revision 1, status draft
          headers:
            ETag: { schema: { type: string, example: '"1"' }, description: Quoted draft revision }
            Cache-Control: { schema: { type: string, example: no-store } }
          content: { application/json: { schema: { $ref: '#/components/schemas/AdminStation' } } }
        '400': { description: 'VALIDATION_FAILED: details {field, reason}; reasons body_must_be_object, unknown_field, required, must_be_string, length, control_characters, iso_3166_alpha2, iso_639, max_5, slug, must_be_url, https_required, credentials_not_allowed, fragment_not_allowed, ip_literal_not_allowed, private_host, nonstandard_port, value_not_allowed, out_of_range', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '401': { description: 'AUTH_REQUIRED, or MFA_REQUIRED with details {scope: session, maxAgeSeconds: 43200}', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '403': { description: 'ROLE_REQUIRED: needs catalog_editor or admin', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '409': { description: 'IDEMPOTENCY_KEY_REUSED, or IDEMPOTENCY_IN_PROGRESS (Retry-After: 1)', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '413': { $ref: '#/components/responses/Error' }
  /v1/admin/stations/summary:
    get:
      summary: Catalog counts for the console header (catalog_editor, admin)
      description: 'Roles: catalog_editor or admin. visible counts what GET /v1/catalog/radio serves right now; pending, drafts and disabled use the same rules as AdminStation.status. Cache-Control: no-store.'
      responses:
        '200':
          description: Counts
          headers: { Cache-Control: { schema: { type: string, example: no-store } } }
          content:
            application/json:
              schema:
                type: object
                required: [total, visible, pending, drafts, disabled]
                properties:
                  total: { type: integer, minimum: 0 }
                  visible: { type: integer, minimum: 0 }
                  pending: { type: integer, minimum: 0, description: Status changes_pending }
                  drafts: { type: integer, minimum: 0 }
                  disabled: { type: integer, minimum: 0 }
        '401': { description: 'AUTH_REQUIRED, or MFA_REQUIRED with details {scope: session, maxAgeSeconds: 43200}', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '403': { description: 'ROLE_REQUIRED: needs catalog_editor or admin', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /v1/admin/stations/{stationId}:
    parameters:
      - { $ref: '#/components/parameters/StationId' }
    get:
      summary: Read one station (catalog_editor, admin)
      description: 'Roles: catalog_editor or admin. A stationId that is not a UUID is 400 (field stationId, must_be_uuid).'
      responses:
        '200':
          description: Station with its stream health
          headers:
            ETag: { schema: { type: string, example: '"3"' }, description: Quoted draft revision }
            Cache-Control: { schema: { type: string, example: no-store } }
          content: { application/json: { schema: { $ref: '#/components/schemas/AdminStation' } } }
        '400': { $ref: '#/components/responses/Error' }
        '401': { description: 'AUTH_REQUIRED, or MFA_REQUIRED with details {scope: session, maxAgeSeconds: 43200}', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '403': { description: 'ROLE_REQUIRED: needs catalog_editor or admin', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '404': { $ref: '#/components/responses/Error' }
    patch:
      summary: Edit the draft (catalog_editor, admin); the public catalog is unchanged until publish
      description: 'Roles: catalog_editor or admin. Compare-and-set on the draft revision. A patch that changes nothing returns the station unchanged (same revision, no audit). Otherwise the revision goes up by one, the caller becomes a draft author and it is audited as station.update.'
      parameters:
        - { name: If-Match, in: header, required: true, description: 'The draft revision the editor last read, quoted, e.g. "3"', schema: { type: string, pattern: '^"\d{1,15}"$' } }
        - { name: Idempotency-Key, in: header, required: false, description: 'Optional; see POST /v1/admin/stations', schema: { type: string, pattern: '^[A-Za-z0-9_.:-]{8,128}$' } }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/StationPatch' } } }
      responses:
        '200':
          description: Saved
          headers:
            ETag: { schema: { type: string }, description: Quoted draft revision }
            Cache-Control: { schema: { type: string, example: no-store } }
          content: { application/json: { schema: { $ref: '#/components/schemas/AdminStation' } } }
        '400': { description: 'VALIDATION_FAILED: as for create, plus empty_patch, and If-Match malformed', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '401': { description: 'AUTH_REQUIRED, or MFA_REQUIRED with details {scope: session, maxAgeSeconds: 43200}', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '403': { description: 'ROLE_REQUIRED: needs catalog_editor or admin', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '404': { $ref: '#/components/responses/Error' }
        '409': { description: 'IDEMPOTENCY_KEY_REUSED or IDEMPOTENCY_IN_PROGRESS', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '412': { description: 'REVISION_MISMATCH with details.currentRevision', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '413': { $ref: '#/components/responses/Error' }
        '428': { description: PRECONDITION_REQUIRED (no If-Match), content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /v1/admin/stations/{stationId}/publish:
    parameters:
      - { $ref: '#/components/parameters/StationId' }
    post:
      summary: Publish the reviewed draft revision (admin who did not change it, or an emergency)
      description: 'Role: admin only. Needs recent MFA: an access token whose acr is in STAFF_MFA_ACR with auth_time within 300 seconds. Two-person rule: an admin who changed the draft since its last publish is blocked with own_change, unless the body says emergency: true with a reason of at least 20 characters; that skips only own_change and is audited as station.publish_emergency (reviewer none). Otherwise audited as station.publish. An active, current rights record covering the draft country is always required. Order of checks: If-Match header, body, recent MFA, then the station.'
      parameters:
        - { name: If-Match, in: header, required: true, description: 'The draft revision the admin reviewed, quoted', schema: { type: string, pattern: '^"\d{1,15}"$' } }
        - { name: Idempotency-Key, in: header, required: false, description: 'Optional; see POST /v1/admin/stations', schema: { type: string, pattern: '^[A-Za-z0-9_.:-]{8,128}$' } }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/AdminStationPublish' } } }
      responses:
        '200':
          description: Published; the public catalog serves this revision now (subject to rights and disable)
          headers:
            ETag: { schema: { type: string }, description: Quoted draft revision }
            Cache-Control: { schema: { type: string, example: no-store } }
          content: { application/json: { schema: { $ref: '#/components/schemas/AdminStation' } } }
        '400': { description: 'VALIDATION_FAILED: reason (must_be_string, length, control_characters, too_short for an emergency under 20 characters), emergency (must_be_boolean), unknown_field, If-Match malformed', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '401': { description: 'AUTH_REQUIRED; MFA_REQUIRED with details {scope: session, maxAgeSeconds: 43200} (staff session); or MFA_REQUIRED with details {maxAgeSeconds: 300} and no scope (MFA sign-in older than 5 minutes: sign in again with step-up)', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '403': { description: 'ROLE_REQUIRED: needs admin', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '404': { $ref: '#/components/responses/Error' }
        '409': { description: 'PUBLISH_BLOCKED with details.reasons, any of own_change, already_published, rights_missing, rights_territory, rights_not_yet_valid, rights_expired; or IDEMPOTENCY_KEY_REUSED / IDEMPOTENCY_IN_PROGRESS', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '412': { description: 'REVISION_MISMATCH with details.currentRevision', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '413': { $ref: '#/components/responses/Error' }
        '428': { description: PRECONDITION_REQUIRED (no If-Match), content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /v1/admin/stations/{stationId}/disable:
    parameters:
      - { $ref: '#/components/parameters/StationId' }
    post:
      summary: Hide from the public catalog at once (admin)
      description: 'Role: admin only. Draft and published snapshot are untouched. Disabling again keeps the first disabledAt. Audited as station.disable with the reason.'
      parameters:
        - { name: Idempotency-Key, in: header, required: false, description: 'Optional; see POST /v1/admin/stations', schema: { type: string, pattern: '^[A-Za-z0-9_.:-]{8,128}$' } }
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/Reason' } } } }
      responses:
        '200':
          description: Disabled
          headers:
            ETag: { schema: { type: string }, description: Quoted draft revision }
            Cache-Control: { schema: { type: string, example: no-store } }
          content: { application/json: { schema: { $ref: '#/components/schemas/AdminStation' } } }
        '400': { description: 'VALIDATION_FAILED: reason (must_be_string, length, control_characters) or unknown_field', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '401': { description: 'AUTH_REQUIRED, or MFA_REQUIRED with details {scope: session, maxAgeSeconds: 43200}', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '403': { description: 'ROLE_REQUIRED: needs admin', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '404': { $ref: '#/components/responses/Error' }
        '409': { description: 'IDEMPOTENCY_KEY_REUSED or IDEMPOTENCY_IN_PROGRESS', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '413': { $ref: '#/components/responses/Error' }
  /v1/admin/stations/{stationId}/enable:
    parameters:
      - { $ref: '#/components/parameters/StationId' }
    post:
      summary: Return to the public catalog (admin)
      description: 'Role: admin only. Clears disabledAt; the station shows again if it is published and its rights are current. Audited as station.enable with the reason.'
      parameters:
        - { name: Idempotency-Key, in: header, required: false, description: 'Optional; see POST /v1/admin/stations', schema: { type: string, pattern: '^[A-Za-z0-9_.:-]{8,128}$' } }
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/Reason' } } } }
      responses:
        '200':
          description: Enabled
          headers:
            ETag: { schema: { type: string }, description: Quoted draft revision }
            Cache-Control: { schema: { type: string, example: no-store } }
          content: { application/json: { schema: { $ref: '#/components/schemas/AdminStation' } } }
        '400': { description: 'VALIDATION_FAILED: reason (must_be_string, length, control_characters) or unknown_field', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '401': { description: 'AUTH_REQUIRED, or MFA_REQUIRED with details {scope: session, maxAgeSeconds: 43200}', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '403': { description: 'ROLE_REQUIRED: needs admin', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '404': { $ref: '#/components/responses/Error' }
        '409': { description: 'IDEMPOTENCY_KEY_REUSED or IDEMPOTENCY_IN_PROGRESS', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '413': { $ref: '#/components/responses/Error' }
  /v1/admin/stations/{stationId}/health:
    parameters:
      - { $ref: '#/components/parameters/StationId' }
    get:
      summary: The last 20 stream checks of the station, newest first (catalog_editor, admin)
      description: 'Roles: catalog_editor or admin. Result codes only, never URLs. Scheduled and manual checks, of the published or (before the first publish) the draft stream. An unknown station is 404.'
      responses:
        '200':
          description: Checks
          headers: { Cache-Control: { schema: { type: string, example: no-store } } }
          content: { application/json: { schema: { type: object, required: [checks], properties: { checks: { type: array, maxItems: 20, items: { $ref: '#/components/schemas/AdminStationCheck' } } } } } }
        '400': { $ref: '#/components/responses/Error' }
        '401': { description: 'AUTH_REQUIRED, or MFA_REQUIRED with details {scope: session, maxAgeSeconds: 43200}', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '403': { description: 'ROLE_REQUIRED: needs catalog_editor or admin', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '404': { $ref: '#/components/responses/Error' }
  /v1/admin/stations/{stationId}/check:
    parameters:
      - { $ref: '#/components/parameters/StationId' }
    post:
      summary: Check the stream now (catalog_editor, admin)
      description: 'Roles: catalog_editor or admin. No request body. Checks the published stream, or the draft stream before the first publish, with the Doc 17 bounds (HTTPS 443, public addresses only, at most 3 redirects, 10 s). One manual check per station per minute, counted from the audit trail. Audited as station.check. With STATION_CHECK_RUNNER=worker the separate checker runs it and the API waits up to 15 s.'
      parameters:
        - { name: Idempotency-Key, in: header, required: false, description: 'Optional; see POST /v1/admin/stations', schema: { type: string, pattern: '^[A-Za-z0-9_.:-]{8,128}$' } }
      responses:
        '200':
          description: The check result (a failed stream is still 200 with ok false)
          headers: { Cache-Control: { schema: { type: string, example: no-store } } }
          content: { application/json: { schema: { $ref: '#/components/schemas/AdminStationCheck' } } }
        '400': { $ref: '#/components/responses/Error' }
        '401': { description: 'AUTH_REQUIRED, or MFA_REQUIRED with details {scope: session, maxAgeSeconds: 43200}', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '403': { description: 'ROLE_REQUIRED: needs catalog_editor or admin', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '404': { $ref: '#/components/responses/Error' }
        '409': { description: 'IDEMPOTENCY_KEY_REUSED or IDEMPOTENCY_IN_PROGRESS', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '429': { description: 'CHECK_TOO_SOON: at most one manual check per station per minute; details.retryAfterSeconds and the Retry-After header give the seconds left', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '503': { description: 'CHECKER_UNAVAILABLE: worker mode and the checker did not answer within 15 s', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /v1/admin/stations/{stationId}/rights:
    parameters:
      - { $ref: '#/components/parameters/StationId' }
    get:
      summary: The station's rights records, newest first, with private evidence keys (catalog_editor, admin)
      description: 'Roles: catalog_editor or admin. evidenceRefs appear only in this response.'
      responses:
        '200':
          description: Records
          headers: { Cache-Control: { schema: { type: string, example: no-store } } }
          content: { application/json: { schema: { type: object, required: [records], properties: { records: { type: array, items: { $ref: '#/components/schemas/RightsRecord' } } } } } }
        '400': { $ref: '#/components/responses/Error' }
        '401': { description: 'AUTH_REQUIRED, or MFA_REQUIRED with details {scope: session, maxAgeSeconds: 43200}', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '403': { description: 'ROLE_REQUIRED: needs catalog_editor or admin', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '404': { $ref: '#/components/responses/Error' }
    post:
      summary: Add a rights record (catalog_editor, admin); the publish gate and the public catalog follow it at once
      description: 'Roles: catalog_editor or admin. Territories are de-duplicated and sorted, evidence keys de-duplicated. Audited as rights.add with basis, reference, territories, dates and the evidence count (no holder, no evidence keys).'
      parameters:
        - { name: Idempotency-Key, in: header, required: false, description: 'Optional; see POST /v1/admin/stations', schema: { type: string, pattern: '^[A-Za-z0-9_.:-]{8,128}$' } }
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/NewRightsRecord' } } } }
      responses:
        '201':
          description: Added; the body has evidenceCount but no evidenceRefs
          headers: { Cache-Control: { schema: { type: string, example: no-store } } }
          content: { application/json: { schema: { $ref: '#/components/schemas/RightsRecord' } } }
        '400': { description: 'VALIDATION_FAILED: details {field, reason}; reasons body_must_be_object, unknown_field, required, value_not_allowed (basis), length (territories, holder, reference), iso_3166_alpha2, date_yyyy_mm_dd, before_valid_from, max_10, opaque_key, must_be_string, control_characters', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '401': { description: 'AUTH_REQUIRED, or MFA_REQUIRED with details {scope: session, maxAgeSeconds: 43200}', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '403': { description: 'ROLE_REQUIRED: needs catalog_editor or admin', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '404': { $ref: '#/components/responses/Error' }
        '409': { description: 'IDEMPOTENCY_KEY_REUSED or IDEMPOTENCY_IN_PROGRESS', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '413': { $ref: '#/components/responses/Error' }
  /v1/admin/stations/{stationId}/rights/{recordId}/revoke:
    parameters:
      - { $ref: '#/components/parameters/StationId' }
      - { name: recordId, in: path, required: true, schema: { type: string, format: uuid }, description: 'Not a UUID: 400 (field recordId, must_be_uuid)' }
    post:
      summary: Revoke a rights record with a reason (catalog_editor, admin)
      description: 'Roles: catalog_editor or admin. Without another active, current record covering the station country the station leaves the public catalog at once. Audited as rights.revoke with the reason.'
      parameters:
        - { name: Idempotency-Key, in: header, required: false, description: 'Optional; see POST /v1/admin/stations', schema: { type: string, pattern: '^[A-Za-z0-9_.:-]{8,128}$' } }
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/Reason' } } } }
      responses:
        '200':
          description: Revoked; the body has no evidenceRefs
          headers: { Cache-Control: { schema: { type: string, example: no-store } } }
          content: { application/json: { schema: { $ref: '#/components/schemas/RightsRecord' } } }
        '400': { $ref: '#/components/responses/Error' }
        '401': { description: 'AUTH_REQUIRED, or MFA_REQUIRED with details {scope: session, maxAgeSeconds: 43200}', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '403': { description: 'ROLE_REQUIRED: needs catalog_editor or admin', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '404': { description: 'NOT_FOUND (station, or a record of another station)', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '409': { description: 'RIGHTS_ALREADY_REVOKED, or IDEMPOTENCY_KEY_REUSED / IDEMPOTENCY_IN_PROGRESS', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '413': { $ref: '#/components/responses/Error' }
  /v1/admin/stations/{stationId}/history:
    parameters:
      - { $ref: '#/components/parameters/StationId' }
      - { name: cursor, in: query, schema: { type: string, pattern: '^[A-Za-z0-9_-]{1,1024}$' }, description: Opaque; from nextCursor }
      - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 50 } }
    get:
      summary: Version history from the audit trail (station.* and rights.*), newest first (catalog_editor, admin)
      description: 'Roles: catalog_editor or admin.'
      responses:
        '200':
          description: One page
          headers: { Cache-Control: { schema: { type: string, example: no-store } } }
          content:
            application/json:
              schema:
                type: object
                required: [events, nextCursor]
                properties:
                  events: { type: array, items: { $ref: '#/components/schemas/AdminStationHistoryEntry' } }
                  nextCursor: { type: [string, 'null'] }
        '400': { description: 'VALIDATION_FAILED: limit (out_of_range) or cursor (malformed)', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '401': { description: 'AUTH_REQUIRED, or MFA_REQUIRED with details {scope: session, maxAgeSeconds: 43200}', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '403': { description: 'ROLE_REQUIRED: needs catalog_editor or admin', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '404': { $ref: '#/components/responses/Error' }
  /v1/admin/audit:
    get:
      summary: Search the audit trail, newest first (auditor, admin)
      description: 'Roles: auditor or admin. Window at most 90 days (default the 7 days before `to`, which defaults to now). Each search is itself written to the audit trail as audit.search in the same transaction; audit.search and logs.search rows are hidden unless includeReads is 1 or true.'
      parameters:
        - { name: from, in: query, schema: { type: string, format: date-time }, description: 'ISO 8601 with Z or an offset; default to minus 7 days' }
        - { name: to, in: query, schema: { type: string, format: date-time }, description: 'ISO 8601 with Z or an offset; default now' }
        - { name: actor, in: query, schema: { type: string, pattern: '^[A-Za-z0-9._:@|-]{1,128}$' }, description: 'An OIDC subject (or internal user id), or operator:<label> for the staff CLI' }
        - { name: action, in: query, schema: { type: string, pattern: '^[a-z_]{1,40}(\.[a-z_]{1,40})?$' }, description: 'A full action (station.publish) or a family (station)' }
        - { name: targetType, in: query, schema: { type: string, pattern: '^[a-z_]{1,40}$' } }
        - { name: targetId, in: query, schema: { type: string, pattern: '^[A-Za-z0-9._*-]{1,64}$' } }
        - { name: requestId, in: query, schema: { type: string, pattern: '^[A-Za-z0-9._-]{8,64}$' } }
        - { name: includeReads, in: query, schema: { type: string, enum: ['0', '1', 'true', 'false'], default: '0' } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 50 } }
        - { name: cursor, in: query, schema: { type: string, pattern: '^[A-Za-z0-9_-]{1,120}$' }, description: Opaque; from nextCursor }
      responses:
        '200':
          description: One page
          headers: { Cache-Control: { schema: { type: string, example: no-store } } }
          content: { application/json: { schema: { type: object, required: [events, nextCursor], properties: { events: { type: array, items: { $ref: '#/components/schemas/AdminAuditEvent' } }, nextCursor: { type: [string, 'null'] } } } } }
        '400': { description: 'VALIDATION_FAILED: details.field names the filter (reason invalid), from with after_to or window_too_long, cursor malformed', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '401': { description: 'AUTH_REQUIRED, or MFA_REQUIRED with details {scope: session, maxAgeSeconds: 43200}', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '403': { description: 'ROLE_REQUIRED: needs auditor or admin', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /v1/admin/audit/export:
    post:
      summary: Export the same audit search as CSV (auditor, admin)
      description: 'Roles: auditor or admin. Needs recent MFA (acr in STAFF_MFA_ACR, auth_time within 300 seconds). Filters as for GET /v1/admin/audit, in the query string; limit and cursor are validated but ignored. At most 10,000 rows, newest first. CSV is UTF-8 with a BOM, CRLF lines, cells starting with = + - @ tab or CR prefixed with an apostrophe. Columns: id, occurredAt, actor, actorSubject, action, targetType, targetId, targetLabel, reason, changes, requestId. Audited as audit.export with the reason, filters and row count. An Idempotency-Key is accepted but a CSV result is never replayed (the key is released). Order of checks: filters, reason, recent MFA.'
      parameters:
        - { name: from, in: query, schema: { type: string, format: date-time } }
        - { name: to, in: query, schema: { type: string, format: date-time } }
        - { name: actor, in: query, schema: { type: string, pattern: '^[A-Za-z0-9._:@|-]{1,128}$' } }
        - { name: action, in: query, schema: { type: string, pattern: '^[a-z_]{1,40}(\.[a-z_]{1,40})?$' } }
        - { name: targetType, in: query, schema: { type: string, pattern: '^[a-z_]{1,40}$' } }
        - { name: targetId, in: query, schema: { type: string, pattern: '^[A-Za-z0-9._*-]{1,64}$' } }
        - { name: requestId, in: query, schema: { type: string, pattern: '^[A-Za-z0-9._-]{8,64}$' } }
        - { name: includeReads, in: query, schema: { type: string, enum: ['0', '1', 'true', 'false'], default: '0' } }
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/AdminExportReason' } } } }
      responses:
        '200':
          description: CSV file
          headers:
            Content-Disposition: { schema: { type: string, example: 'attachment; filename="tunedeck-audit-2026-10-05.csv"' } }
            Cache-Control: { schema: { type: string, example: no-store } }
          content: { text/csv: { schema: { type: string } } }
        '400': { description: 'VALIDATION_FAILED: a filter as for the search; reason (required, length, control_characters); from with too_many_rows when more than 10,000 rows match', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '401': { description: 'AUTH_REQUIRED; MFA_REQUIRED with details {scope: session, maxAgeSeconds: 43200}; or MFA_REQUIRED with details {maxAgeSeconds: 300} and no scope (sign in again with step-up)', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '403': { description: 'ROLE_REQUIRED: needs auditor or admin', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '413': { $ref: '#/components/responses/Error' }
  /v1/admin/logs:
    get:
      summary: Search the API's operational logs, newest first (operator, admin)
      description: 'Roles: operator or admin. Window at most 24 hours (default the hour before `to`, which defaults to now); logs are kept 14 days. Each search is written to the audit trail as logs.search before results are returned.'
      parameters:
        - { name: from, in: query, schema: { type: string, format: date-time }, description: 'ISO 8601 with Z or an offset; default to minus 1 hour' }
        - { name: to, in: query, schema: { type: string, format: date-time }, description: 'ISO 8601 with Z or an offset; default now' }
        - { name: severity, in: query, schema: { type: string, pattern: '^[A-Z,]{1,40}$', example: 'WARN,ERROR' }, description: 'Comma-separated, each one of DEBUG, INFO, WARN, ERROR' }
        - { name: service, in: query, schema: { type: string, enum: [api] } }
        - { name: build, in: query, schema: { type: string, pattern: '^[A-Za-z0-9._+-]{1,64}$' } }
        - { name: eventCode, in: query, schema: { type: string, pattern: '^[A-Z][A-Z0-9_]{0,63}$' } }
        - { name: requestId, in: query, schema: { type: string, pattern: '^[A-Za-z0-9._-]{8,64}$' } }
        - { name: traceId, in: query, schema: { type: string, pattern: '^[0-9a-f]{32}$' } }
        - { name: errorCode, in: query, schema: { type: string, pattern: '^[A-Za-z0-9_.-]{1,64}$' } }
        - { name: status, in: query, schema: { type: integer, minimum: 100, maximum: 599 } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 50 } }
        - { name: cursor, in: query, schema: { type: string, pattern: '^[A-Za-z0-9_-]{1,120}$' }, description: Opaque; from nextCursor }
      responses:
        '200':
          description: One page
          headers: { Cache-Control: { schema: { type: string, example: no-store } } }
          content: { application/json: { schema: { type: object, required: [logs, nextCursor, retentionDays], properties: { logs: { type: array, items: { $ref: '#/components/schemas/AdminLogLine' } }, nextCursor: { type: [string, 'null'] }, retentionDays: { type: integer, const: 14 } } } } }
        '400': { description: 'VALIDATION_FAILED: details.field names the filter (reason invalid), from with after_to or window_too_long, cursor malformed', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '401': { description: 'AUTH_REQUIRED, or MFA_REQUIRED with details {scope: session, maxAgeSeconds: 43200}', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '403': { description: 'ROLE_REQUIRED: needs operator or admin', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /v1/admin/logs/export:
    post:
      summary: Export the same log search as CSV (operator, admin)
      description: 'Roles: operator or admin. Needs recent MFA (acr in STAFF_MFA_ACR, auth_time within 300 seconds). Filters as for GET /v1/admin/logs, in the query string, with the same 24-hour window; limit and cursor are validated but ignored. At most 10,000 lines, newest first. CSV is UTF-8 with a BOM, CRLF lines, formula-like cells prefixed with an apostrophe. Columns: id, timestamp, severity, service, environment, build, eventCode, requestId, traceId, method, route, status, durationMs, actorId, errorName, errorCode. Audited as logs.export with the reason, filters and row count (never the lines). An Idempotency-Key is accepted but a CSV result is never replayed. Order of checks: filters, reason, recent MFA.'
      parameters:
        - { name: from, in: query, schema: { type: string, format: date-time } }
        - { name: to, in: query, schema: { type: string, format: date-time } }
        - { name: severity, in: query, schema: { type: string, pattern: '^[A-Z,]{1,40}$' }, description: 'Comma-separated, each one of DEBUG, INFO, WARN, ERROR' }
        - { name: service, in: query, schema: { type: string, enum: [api] } }
        - { name: build, in: query, schema: { type: string, pattern: '^[A-Za-z0-9._+-]{1,64}$' } }
        - { name: eventCode, in: query, schema: { type: string, pattern: '^[A-Z][A-Z0-9_]{0,63}$' } }
        - { name: requestId, in: query, schema: { type: string, pattern: '^[A-Za-z0-9._-]{8,64}$' } }
        - { name: traceId, in: query, schema: { type: string, pattern: '^[0-9a-f]{32}$' } }
        - { name: errorCode, in: query, schema: { type: string, pattern: '^[A-Za-z0-9_.-]{1,64}$' } }
        - { name: status, in: query, schema: { type: integer, minimum: 100, maximum: 599 } }
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/AdminExportReason' } } } }
      responses:
        '200':
          description: CSV file
          headers:
            Content-Disposition: { schema: { type: string, example: 'attachment; filename="tunedeck-logs-2026-10-05.csv"' } }
            Cache-Control: { schema: { type: string, example: no-store } }
          content: { text/csv: { schema: { type: string } } }
        '400': { description: 'VALIDATION_FAILED: a filter as for the search; reason (required, length, control_characters); from with too_many_rows when more than 10,000 lines match', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '401': { description: 'AUTH_REQUIRED; MFA_REQUIRED with details {scope: session, maxAgeSeconds: 43200}; or MFA_REQUIRED with details {maxAgeSeconds: 300} and no scope (sign in again with step-up)', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '403': { description: 'ROLE_REQUIRED: needs operator or admin', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '413': { $ref: '#/components/responses/Error' }
  /v1/admin/metrics:
    get:
      summary: Operational metrics per hour or UTC day, overall and for the 50 busiest routes (operator, admin)
      description: 'Roles: operator or admin. Default the 24 hours before `to` (default now) by hour. Hourly over at most 14 days, daily over at most 90; `from` may not be more than 91 days ago. Buckets are whole hours or UTC days that overlap the range. Rolled up from the request log every 5 minutes (and before a read if the last rollup is older than a minute) into api_metrics_hourly, kept 90 days. Labels are method and route template only.'
      parameters:
        - { name: from, in: query, schema: { type: string, format: date-time }, description: ISO 8601 with Z or an offset }
        - { name: to, in: query, schema: { type: string, format: date-time }, description: ISO 8601 with Z or an offset }
        - { name: bucket, in: query, schema: { type: string, enum: [1h, 1d], default: 1h } }
        - { name: method, in: query, schema: { type: string, enum: [GET, POST, PUT, PATCH, DELETE] } }
        - { name: route, in: query, schema: { type: string, pattern: '^/[A-Za-z0-9/:_-]{0,200}$', example: '/v1/admin/stations/:id' }, description: Express route template as logged }
      responses:
        '200':
          description: Metrics
          headers: { Cache-Control: { schema: { type: string, example: no-store } } }
          content: { application/json: { schema: { $ref: '#/components/schemas/AdminMetrics' } } }
        '400': { description: 'VALIDATION_FAILED: details.field names the parameter (reason invalid), or from with after_to, window_too_long or past_retention', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '401': { description: 'AUTH_REQUIRED, or MFA_REQUIRED with details {scope: session, maxAgeSeconds: 43200}', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '403': { description: 'ROLE_REQUIRED: needs operator or admin', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /v1/admin/overview:
    get:
      summary: Operations overview for one window, aggregates only (operator, admin)
      description: 'Roles: operator or admin. Request counts, errors and latency from the stored request logs, station health counts, the account-deletion queue, diagnostics count and incidents (window findings plus every open alert). No user, request or station ids.'
      parameters:
        - { name: window, in: query, schema: { type: string, enum: [1h, 24h, 7d], default: 24h }, description: 'Bars of 5 minutes, 1 hour and 6 hours respectively' }
      responses:
        '200':
          description: Overview
          headers: { Cache-Control: { schema: { type: string, example: no-store } } }
          content: { application/json: { schema: { $ref: '#/components/schemas/AdminOverview' } } }
        '400': { description: 'VALIDATION_FAILED: field window, reason invalid', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '401': { description: 'AUTH_REQUIRED, or MFA_REQUIRED with details {scope: session, maxAgeSeconds: 43200}', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '403': { description: 'ROLE_REQUIRED: needs operator or admin', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /v1/admin/jobs:
    get:
      summary: Background jobs of every queue, with per-queue counts (operator, admin)
      description: 'Roles: operator or admin. Queues account_deletion, account_export and (only when a Keycloak admin client is configured) idp_session_end. Dead letters first, then retrying, then by request time; at most 100 jobs (truncated true when there are more). Completed jobs are listed for 7 days. Ids are opaque.'
      parameters:
        - { name: status, in: query, schema: { type: string, enum: [open, failed, dead_letter, completed, all], default: open }, description: 'open = pending, retrying and dead_letter; failed = retrying and dead_letter' }
      responses:
        '200':
          description: Jobs
          headers: { Cache-Control: { schema: { type: string, example: no-store } } }
          content: { application/json: { schema: { $ref: '#/components/schemas/AdminJobList' } } }
        '400': { description: 'VALIDATION_FAILED: field status, reason invalid', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '401': { description: 'AUTH_REQUIRED, or MFA_REQUIRED with details {scope: session, maxAgeSeconds: 43200}', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '403': { description: 'ROLE_REQUIRED: needs operator or admin', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /v1/admin/jobs/{jobId}/retry:
    parameters:
      - { name: jobId, in: path, required: true, schema: { type: string, pattern: '^(?:[0-9a-f]{64}|ex_[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}|se_[0-9a-f]{64})$' }, description: 'A deletion ticket hash, ex_<export id> or se_<sha256>; anything else is 404' }
    post:
      summary: Run one job now (operator, admin)
      description: 'Roles: operator or admin. Deletions run under the queue lock; a dead-lettered job starts a new round of 5 attempts. A job that already finished returns completed and runs nothing (not audited). At most 3 staff retries per job in 24 hours, counted from the audit trail. Audited as job.retry with the reason, kind, state and attempts before, and the result.'
      parameters:
        - { name: Idempotency-Key, in: header, required: false, description: 'Optional. A repeat with the same body within 24 hours gets the first response again (Idempotent-Replayed: true)', schema: { type: string, pattern: '^[A-Za-z0-9_.:-]{8,128}$' } }
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/AdminExportReason' } } } }
      responses:
        '200':
          description: The job's status afterwards
          content: { application/json: { schema: { type: object, required: [status], properties: { status: { type: string, enum: [pending, retrying, dead_letter, completed] } } } } }
        '400': { description: 'VALIDATION_FAILED: reason (required, length, control_characters)', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '401': { description: 'AUTH_REQUIRED, or MFA_REQUIRED with details {scope: session, maxAgeSeconds: 43200}', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '403': { description: 'ROLE_REQUIRED: needs operator or admin', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '404': { description: 'NOT_FOUND: unknown or malformed id, an idp_session_end job without a Keycloak admin client, or an export that is gone', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '409': { description: 'JOB_RETRY_LIMIT with details {limit: 3, windowHours: 24}; JOB_BUSY while a background run holds the job; JOB_SUPERSEDED for a dead-lettered export whose account asked for a new one; or IDEMPOTENCY_KEY_REUSED / IDEMPOTENCY_IN_PROGRESS', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '413': { $ref: '#/components/responses/Error' }
        '429': { description: 'JOB_RETRY_TOO_SOON within 60 s of the last attempt, with details.retryAfterSeconds and the Retry-After header (the seconds left)', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /v1/admin/users/lookup:
    post:
      summary: Support lookup of one account by user id, device id or email (support, admin)
      description: 'Roles: support or admin. query is trimmed and lower-cased: a UUID is tried as a user id, then as a device id (a device id on more than one account is a miss); otherwise an email of at most 320 characters, exact and any case (an email on more than one account is a miss). No setting values, stations or roles. Every lookup, misses included, is audited as user.lookup with the reason; the searched email is never written to the audit.'
      parameters:
        - { name: Idempotency-Key, in: header, required: false, description: 'Optional; see POST /v1/admin/jobs/{jobId}/retry', schema: { type: string, pattern: '^[A-Za-z0-9_.:-]{8,128}$' } }
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/AdminUserLookupRequest' } } } }
      responses:
        '200':
          description: The account
          headers: { Cache-Control: { schema: { type: string, example: no-store } } }
          content: { application/json: { schema: { $ref: '#/components/schemas/AdminUserSupportView' } } }
        '400': { description: 'VALIDATION_FAILED: query (invalid) or reason (required, length, control_characters)', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '401': { description: 'AUTH_REQUIRED, or MFA_REQUIRED with details {scope: session, maxAgeSeconds: 43200}', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '403': { description: 'ROLE_REQUIRED: needs support or admin', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '404': { description: NOT_FOUND (no single matching account; still audited), content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '409': { description: 'IDEMPOTENCY_KEY_REUSED or IDEMPOTENCY_IN_PROGRESS', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '413': { $ref: '#/components/responses/Error' }
  /v1/admin/users/{userId}/diagnostics:
    parameters:
      - { name: userId, in: path, required: true, schema: { type: string, format: uuid }, description: 'The customer account id (from the lookup). Not a UUID: 404' }
    get:
      summary: The customer's 20 most recent diagnostic reports with their events (support, admin with a running access)
      description: 'Roles: support or admin, and the caller must hold a running access to this customer (granted by the customer''s code through POST .../diagnostics/access; personal to that staff member, 7 days). Reports from the last 7 days, newest first, events without event or session ids. Every read is audited as support.diagnostics_read.'
      responses:
        '200':
          description: Reports
          headers: { Cache-Control: { schema: { type: string, example: no-store } } }
          content: { application/json: { schema: { $ref: '#/components/schemas/AdminSupportDiagnostics' } } }
        '401': { description: 'AUTH_REQUIRED, or MFA_REQUIRED with details {scope: session, maxAgeSeconds: 43200}', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '403': { description: 'ROLE_REQUIRED: needs support or admin; or SUPPORT_ACCESS_REQUIRED: no running access to this customer (also for an unknown customer)', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '404': { description: NOT_FOUND (userId not a UUID), content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /v1/admin/users/{userId}/diagnostics/access:
    parameters:
      - { name: userId, in: path, required: true, schema: { type: string, format: uuid }, description: 'The customer account id. Not a UUID: 404' }
    post:
      summary: Enter the customer's one-time support code to get 7 days of access to their diagnostics (support, admin)
      description: 'Roles: support or admin. Grants this staff member only (not the team) 7 days of access. The code is accepted in any case, with or without the dash or spaces. A wrong, used, replaced, expired or other customer''s code is 404 and audited as support.access_refused; success is audited as support.access_granted with the reason. The reason is checked before the code and the userId.'
      parameters:
        - { name: Idempotency-Key, in: header, required: false, description: 'Optional; see POST /v1/admin/jobs/{jobId}/retry', schema: { type: string, pattern: '^[A-Za-z0-9_.:-]{8,128}$' } }
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/AdminSupportAccessRequest' } } } }
      responses:
        '201':
          description: Access granted
          headers: { Cache-Control: { schema: { type: string, example: no-store } } }
          content: { application/json: { schema: { $ref: '#/components/schemas/AdminSupportGrant' } } }
        '400': { description: 'VALIDATION_FAILED: reason (required, length, control_characters) or code (invalid: not 8 characters of the code alphabet)', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '401': { description: 'AUTH_REQUIRED, or MFA_REQUIRED with details {scope: session, maxAgeSeconds: 43200}', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '403': { description: 'ROLE_REQUIRED: needs support or admin', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '404': { description: 'NOT_FOUND: code not valid for this customer (audited), or userId not a UUID', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '409': { description: 'IDEMPOTENCY_KEY_REUSED or IDEMPOTENCY_IN_PROGRESS', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '413': { $ref: '#/components/responses/Error' }
  /v1/admin/config:
    get:
      summary: Remote config draft, current and staged releases, the last 20 releases and blockers (operator, admin)
      description: 'Roles: operator or admin (operators can look; only admins change it). The draft starts from the defaults at revision 0.'
      responses:
        '200':
          description: Config screen
          headers:
            ETag: { schema: { type: string, example: '"4"' }, description: Quoted draft revision }
            Cache-Control: { schema: { type: string, example: no-store } }
          content: { application/json: { schema: { $ref: '#/components/schemas/AdminConfigView' } } }
        '401': { description: 'AUTH_REQUIRED, or MFA_REQUIRED with details {scope: session, maxAgeSeconds: 43200}', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '403': { description: 'ROLE_REQUIRED: needs operator or admin', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /v1/admin/config/draft:
    patch:
      summary: Partial change to the allowlisted config fields and targets (admin)
      description: 'Role: admin only. Compare-and-set on the draft revision. Unknown fields are 400. A patch that changes nothing (including {}) returns the view with the revision unchanged and is not audited; otherwise the revision goes up by one, the caller becomes a draft author and it is audited as config.update with the changed values.'
      parameters:
        - { name: If-Match, in: header, required: true, description: 'The draft revision, quoted; "0" before the first change', schema: { type: string, pattern: '^"\d{1,15}"$' } }
        - { name: Idempotency-Key, in: header, required: false, description: 'Optional; see POST /v1/admin/jobs/{jobId}/retry', schema: { type: string, pattern: '^[A-Za-z0-9_.:-]{8,128}$' } }
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/AdminConfigDraftPatch' } } } }
      responses:
        '200':
          description: Saved (or unchanged)
          headers:
            ETag: { schema: { type: string }, description: Quoted draft revision }
            Cache-Control: { schema: { type: string, example: no-store } }
          content: { application/json: { schema: { $ref: '#/components/schemas/AdminConfigView' } } }
        '400': { description: 'VALIDATION_FAILED: details {field, reason}; reasons unknown_field, must_be_object, must_be_build_number, must_be_boolean, out_of_range, below_min_build, no_platform; If-Match malformed', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '401': { description: 'AUTH_REQUIRED, or MFA_REQUIRED with details {scope: session, maxAgeSeconds: 43200}', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '403': { description: 'ROLE_REQUIRED: needs admin', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '409': { description: 'IDEMPOTENCY_KEY_REUSED or IDEMPOTENCY_IN_PROGRESS', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '412': { description: 'REVISION_MISMATCH with details.currentRevision', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '413': { $ref: '#/components/responses/Error' }
        '428': { description: PRECONDITION_REQUIRED (no If-Match), content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /v1/admin/config/stage:
    post:
      summary: Release the draft to the staging channel for internal builds (admin)
      description: 'Role: admin only; any admin may stage, the author included. Needs recent MFA (acr in STAFF_MFA_ACR, auth_time within 300 seconds). Production later promotes exactly this release. Audited as config.stage. Order of checks: If-Match header, recent MFA, body, then revision and blockers.'
      parameters:
        - { name: If-Match, in: header, required: true, description: 'The draft revision being staged, quoted', schema: { type: string, pattern: '^"\d{1,15}"$' } }
        - { name: Idempotency-Key, in: header, required: false, description: 'Optional; see POST /v1/admin/jobs/{jobId}/retry', schema: { type: string, pattern: '^[A-Za-z0-9_.:-]{8,128}$' } }
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/AdminConfigReleaseRequest' } } } }
      responses:
        '200':
          description: Staged; the view shows it as staged
          headers:
            ETag: { schema: { type: string }, description: Quoted draft revision }
            Cache-Control: { schema: { type: string, example: no-store } }
          content: { application/json: { schema: { $ref: '#/components/schemas/AdminConfigView' } } }
        '400': { description: 'VALIDATION_FAILED: reason (length), validDays (out_of_range), unknown_field; If-Match malformed', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '401': { description: 'AUTH_REQUIRED; MFA_REQUIRED with details {scope: session, maxAgeSeconds: 43200}; or MFA_REQUIRED with details {maxAgeSeconds: 300} and no scope (sign in again with step-up)', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '403': { description: 'ROLE_REQUIRED: needs admin', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '409': { description: 'PUBLISH_BLOCKED with details.reasons, any of already_staged, no_changes; or IDEMPOTENCY_KEY_REUSED / IDEMPOTENCY_IN_PROGRESS', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '412': { description: 'REVISION_MISMATCH with details.currentRevision', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '413': { $ref: '#/components/responses/Error' }
        '428': { description: PRECONDITION_REQUIRED (no If-Match), content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /v1/admin/config/publish:
    post:
      summary: Promote exactly the staged draft to production (admin who did not change it, or an emergency)
      description: 'Role: admin only. Needs recent MFA (acr in STAFF_MFA_ACR, auth_time within 300 seconds). The draft must be staged as it is now. Two-person rule: anyone who changed the draft since the last production release is blocked with own_change, unless emergency: true with a reason of at least 20 characters; that skips only own_change and is audited as config.publish_emergency with no reviewer. Otherwise audited as config.publish with the reviewer. validDays (7 to 90, default 30) sets expiresAt. Order of checks: If-Match header, recent MFA, body, then revision and blockers.'
      parameters:
        - { name: If-Match, in: header, required: true, description: 'The draft revision the admin reviewed, quoted', schema: { type: string, pattern: '^"\d{1,15}"$' } }
        - { name: Idempotency-Key, in: header, required: false, description: 'Optional; see POST /v1/admin/jobs/{jobId}/retry', schema: { type: string, pattern: '^[A-Za-z0-9_.:-]{8,128}$' } }
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/AdminConfigPublishRequest' } } } }
      responses:
        '200':
          description: Published; the view shows the new current release
          headers:
            ETag: { schema: { type: string }, description: Quoted draft revision }
            Cache-Control: { schema: { type: string, example: no-store } }
          content: { application/json: { schema: { $ref: '#/components/schemas/AdminConfigView' } } }
        '400': { description: 'VALIDATION_FAILED: reason (length, too_short for an emergency under 20 characters), validDays (out_of_range), emergency (must_be_boolean), unknown_field; If-Match malformed', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '401': { description: 'AUTH_REQUIRED; MFA_REQUIRED with details {scope: session, maxAgeSeconds: 43200}; or MFA_REQUIRED with details {maxAgeSeconds: 300} and no scope (sign in again with step-up)', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '403': { description: 'ROLE_REQUIRED: needs admin', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '409': { description: 'PUBLISH_BLOCKED with details.reasons, any of own_change, no_changes, not_staged; or IDEMPOTENCY_KEY_REUSED / IDEMPOTENCY_IN_PROGRESS', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '412': { description: 'REVISION_MISMATCH with details.currentRevision', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '413': { $ref: '#/components/responses/Error' }
        '428': { description: PRECONDITION_REQUIRED (no If-Match), content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /v1/admin/config/releases/{release}/rollback:
    parameters:
      - { name: release, in: path, required: true, schema: { type: integer, minimum: 1, maximum: 999999999999999 }, description: 'An earlier production release number. Not a positive integer: 400 (field release, must_be_number)' }
    post:
      summary: Re-release an earlier production payload as a new production release (admin)
      description: 'Role: admin only; one admin may do this alone. Needs recent MFA (acr in STAFF_MFA_ACR, auth_time within 300 seconds). No If-Match. History is never edited and the draft is left as it is; the new release keeps the old payload and targets. Audited as config.rollback. Order of checks: release number, recent MFA, body, then the release.'
      parameters:
        - { name: Idempotency-Key, in: header, required: false, description: 'Optional; see POST /v1/admin/jobs/{jobId}/retry', schema: { type: string, pattern: '^[A-Za-z0-9_.:-]{8,128}$' } }
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/AdminConfigReleaseRequest' } } } }
      responses:
        '200':
          description: Rolled back; the view shows the new current release
          headers:
            ETag: { schema: { type: string }, description: Quoted draft revision }
            Cache-Control: { schema: { type: string, example: no-store } }
          content: { application/json: { schema: { $ref: '#/components/schemas/AdminConfigView' } } }
        '400': { description: 'VALIDATION_FAILED: release (must_be_number), reason (length), validDays (out_of_range), unknown_field', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '401': { description: 'AUTH_REQUIRED; MFA_REQUIRED with details {scope: session, maxAgeSeconds: 43200}; or MFA_REQUIRED with details {maxAgeSeconds: 300} and no scope (sign in again with step-up)', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '403': { description: 'ROLE_REQUIRED: needs admin', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '404': { description: NOT_FOUND (no such release), content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '409': { description: 'PUBLISH_BLOCKED with details.reasons [not_production], [already_current] or [schema_changed]; or IDEMPOTENCY_KEY_REUSED / IDEMPOTENCY_IN_PROGRESS', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '413': { $ref: '#/components/responses/Error' }
security:
  - bearer: []
components:
  securitySchemes:
    bearer: { type: http, scheme: bearer, bearerFormat: JWT, description: 'OIDC access token (iss/aud/exp/RS256 verified via JWKS)' }
  parameters:
    StationId:
      name: stationId
      in: path
      required: true
      schema: { type: string, format: uuid }
    DeviceId:
      name: deviceId
      in: path
      required: true
      description: UUID the app generates once per install (versions 1-8, RFC 4122 variant)
      schema: { type: string, format: uuid }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: 'Optional on signed-in mutations. The same account, method, path and key runs at most once for 24 hours; a repeat with the same body and If-Match replays the first answer with Idempotent-Replayed: true. Different body → 409 IDEMPOTENCY_KEY_REUSED; still running → 409 IDEMPOTENCY_IN_PROGRESS with Retry-After. Ignored where the answer carries a secret (export links, support codes).'
      schema: { type: string, pattern: '^[A-Za-z0-9_.:-]{8,128}$' }
  schemas:
    Health:
      type: object
      required: [status]
      properties: { status: { type: string, enum: [ok, unavailable] } }
    Reason:
      type: object
      additionalProperties: false
      required: [reason]
      properties: { reason: { type: string, minLength: 1, maxLength: 500 } }
    Error:
      type: object
      required: [code, messageKey, requestId, details]
      properties:
        code:
          type: string
          enum: [AUTH_REQUIRED, AUTH_FORBIDDEN, VALIDATION_FAILED, NOT_FOUND, EXPORT_NOT_READY, IDEMPOTENCY_KEY_REQUIRED, PRECONDITION_REQUIRED, REVISION_MISMATCH, PAYLOAD_TOO_LARGE, DEPENDENCY_UNAVAILABLE, REAUTH_REQUIRED, DEVICE_REVOKED, DEVICE_LIMIT, ROLE_REQUIRED, PUBLISH_BLOCKED, CHECK_TOO_SOON, CHECKER_UNAVAILABLE, RIGHTS_ALREADY_REVOKED, API_RATE_LIMITED, ACCOUNT_DELETING, JOB_RETRY_TOO_SOON, JOB_BUSY, JOB_RETRY_LIMIT, JOB_SUPERSEDED, SYNC_RESET_REQUIRED, PURCHASE_INVALID, PURCHASE_CONFLICT, MFA_REQUIRED, IDEMPOTENCY_KEY_REUSED, IDEMPOTENCY_IN_PROGRESS, SUPPORT_ACCESS_REQUIRED, INTERNAL]
        messageKey: { type: string, example: errors.settings.revisionMismatch }
        requestId: { type: string }
        details:
          type: object
          description: 'No tokens or PII. VALIDATION_FAILED → {field?, reason, allowed?}; REVISION_MISMATCH → {currentRevision}; REAUTH_REQUIRED → {maxAgeSeconds}; MFA_REQUIRED → {maxAgeSeconds, scope?}; DEVICE_LIMIT → {maxActiveDevices}; PUBLISH_BLOCKED → {reasons}; IDEMPOTENCY_IN_PROGRESS / CHECK_TOO_SOON / JOB_RETRY_TOO_SOON → {retryAfterSeconds}.'
    Settings:
      type: object
      additionalProperties: false
      required: [theme, language, cellularPolicy]
      properties:
        theme: { type: string, enum: [system, light, dark] }
        language: { type: string, enum: [th, en] }
        cellularPolicy: { type: string, enum: [allow, wifi_only] }
    SettingsPatch:
      type: object
      additionalProperties: false
      minProperties: 1
      description: Only allowlisted keys and values; anything else is 400 (unknown_field / value_not_allowed). Keys left out keep their value.
      properties:
        theme: { type: string, enum: [system, light, dark] }
        language: { type: string, enum: [th, en] }
        cellularPolicy: { type: string, enum: [allow, wifi_only] }
    SettingsView:
      type: object
      required: [revision, schemaVersion, settings, updatedAt]
      properties:
        revision: { type: integer, minimum: 0, description: 0 until the first save }
        schemaVersion: { type: integer, const: 1 }
        settings: { $ref: '#/components/schemas/Settings' }
        updatedAt: { type: [string, 'null'], format: date-time, description: null until the first save }
    DeviceReport:
      type: object
      additionalProperties: false
      required: [platform, osMajor, appBuild]
      description: Everything is allowlisted; no device name, model or advertising id is accepted.
      properties:
        platform: { type: string, enum: [ios, android] }
        osMajor: { type: integer, minimum: 0, maximum: 99 }
        appBuild: { type: string, pattern: '^[0-9A-Za-z.+-]{1,32}$', example: '1.0.0+42' }
        appliedSettingsRevision: { type: integer, minimum: 0, maximum: 9007199254740991, default: 0, description: 'The account settings revision the app has applied; higher than the server''s is 400 ahead_of_server' }
    Device:
      type: object
      required: [id, platform, osMajor, appBuild, appliedSettingsRevision, lastSeenAt, lastSyncedAt, revokedAt, overrides, preferencesRevision]
      properties:
        id: { type: string, format: uuid, description: Lowercase }
        platform: { type: string, enum: [ios, android] }
        osMajor: { type: integer }
        appBuild: { type: string }
        appliedSettingsRevision: { type: integer, minimum: 0 }
        lastSeenAt: { type: string, format: date-time, description: Server time of the last check-in; not a location or listening signal }
        lastSyncedAt: { type: [string, 'null'], format: date-time, description: When the device last finished a sync push or pull; null if never }
        revokedAt: { type: [string, 'null'], format: date-time }
        overrides: { $ref: '#/components/schemas/MeSettingsOverrides' }
        preferencesRevision: { type: integer, minimum: 0, description: The device's preferences revision, 0 until first set }
    DeviceList:
      type: object
      required: [settingsRevision, serverObservedAt, devices, nextCursor]
      properties:
        settingsRevision: { type: integer, minimum: 0, description: The account's current settings revision }
        serverObservedAt: { type: string, format: date-time, description: The server clock when the list was read, to compare lastSeenAt against }
        devices: { type: array, items: { $ref: '#/components/schemas/Device' } }
        nextCursor: { type: [string, 'null'] }
    MeAccount:
      type: object
      required: [userId, email, status, createdAt]
      properties:
        userId: { type: string, format: uuid, description: The account code customers give support }
        email: { type: [string, 'null'], maxLength: 320, description: From the access token's email claim at sign-in; null if the token never carried one }
        status: { type: string, enum: [active, deleting, deleted, disabled], description: Always active in practice; other states are refused at sign-in (403) }
        createdAt: { type: string, format: date-time }
    MeStaff:
      type: object
      required: [roles, mfa, rolesVersion]
      properties:
        roles: { type: array, items: { type: string, enum: [support, catalog_editor, operator, admin, auditor] }, description: Current unrevoked roles, sorted; empty for customers }
        mfa: { type: boolean, description: 'Whether this Keycloak session signed in with MFA within 12 hours (always false without roles; always true in dev without STAFF_MFA_ACR)' }
        rolesVersion: { type: string, minLength: 16, maxLength: 16, description: Digest that changes whenever a role is granted or revoked; end the console session when it changes }
    MeSettingsOverrides:
      type: object
      additionalProperties: false
      description: Only the keys a device sets differently from the account; {} follows the account.
      properties:
        theme: { type: string, enum: [system, light, dark] }
        language: { type: string, enum: [th, en] }
        cellularPolicy: { type: string, enum: [allow, wifi_only] }
    MeDevicePreferencesPut:
      type: object
      required: [overrides]
      description: Other top-level keys are ignored (not refused).
      properties:
        overrides: { $ref: '#/components/schemas/MeSettingsOverrides' }
    MeDevicePreferences:
      type: object
      required: [deviceId, revision, schemaVersion, overrides, effective, accountRevision, updatedAt]
      properties:
        deviceId: { type: string, format: uuid }
        revision: { type: integer, minimum: 0, description: The device's preferences revision, 0 until the first save }
        schemaVersion: { type: integer, const: 1 }
        overrides: { $ref: '#/components/schemas/MeSettingsOverrides' }
        effective: { allOf: [{ $ref: '#/components/schemas/Settings' }], description: What the device should apply (account settings with the overrides on top) }
        accountRevision: { type: integer, minimum: 0, description: The account settings revision the effective values came from }
        updatedAt: { type: [string, 'null'], format: date-time }
    MeDeletionTicket:
      type: object
      required: [ticket, status]
      properties:
        ticket: { type: string, pattern: '^[A-Za-z0-9_-]{43}$', description: 'Secret; poll GET /v1/account-deletions/{ticket}' }
        status: { type: string, const: deleting }
    MeDeletionStatus:
      type: object
      required: [status, requestedAt, deadline, completedAt]
      properties:
        status: { type: string, enum: [deleting, completed, failed], description: 'failed means retrying or dead-lettered (an operator retries it); the account stays locked meanwhile' }
        requestedAt: { type: string, format: date-time }
        deadline: { type: string, format: date-time, description: requestedAt plus 30 days }
        completedAt: { type: [string, 'null'], format: date-time }
    MeExport:
      type: object
      required: [id, status, requestedAt, readyAt, expiresAt]
      properties:
        id: { type: string, format: uuid }
        status: { type: string, enum: [pending, ready, failed], description: A build being retried is still pending; failed after 5 attempts }
        requestedAt: { type: string, format: date-time }
        readyAt: { type: [string, 'null'], format: date-time }
        expiresAt: { type: string, format: date-time, description: requestedAt plus 24 hours; the export is deleted then }
    MeExportLink:
      type: object
      required: [path, expiresAt]
      properties:
        path: { type: string, pattern: '^/v1/export-downloads/[A-Za-z0-9_-]{43}$', description: Relative; prefix with the API base URL }
        expiresAt: { type: string, format: date-time, description: 15 minutes from now, or the export's expiry if sooner }
    MeAccountExport:
      type: object
      required: [format, version, exportedAt, account, settings, devices, favorites, purchases, diagnostics, diagnosticsTruncated, staffRoles]
      description: Everything the service holds about the account (Doc 17 export).
      properties:
        format: { type: string, const: tunedeck-account-export }
        version: { type: integer, const: 1 }
        exportedAt: { type: string, format: date-time }
        account:
          type: object
          required: [id, email, createdAt, locale]
          properties:
            id: { type: string, format: uuid }
            email: { type: [string, 'null'] }
            createdAt: { type: string, format: date-time }
            locale: { type: [string, 'null'] }
        settings: { oneOf: [{ $ref: '#/components/schemas/SettingsView' }, { type: 'null' }], description: null when never saved }
        devices: { type: array, items: { $ref: '#/components/schemas/Device' }, description: Every device, revoked included }
        favorites:
          type: array
          items:
            type: object
            required: [stationId, order, updatedAt]
            properties:
              stationId: { type: string, format: uuid }
              order: { type: integer }
              updatedAt: { type: string, format: date-time }
        purchases:
          type: array
          items:
            type: object
            required: [store, productId, state, environment, purchasedAt, verifiedAt, revokedAt]
            properties:
              store: { type: string, enum: [apple, google] }
              productId: { type: string }
              state: { type: string, enum: [verified, pending, revoked] }
              environment: { type: string, enum: [production, sandbox] }
              purchasedAt: { type: [string, 'null'], format: date-time }
              verifiedAt: { type: [string, 'null'], format: date-time }
              revokedAt: { type: [string, 'null'], format: date-time }
        diagnostics:
          type: array
          items:
            type: object
            required: [id, deviceId, receivedAt, eventCount, events]
            properties:
              id: { type: string, format: uuid }
              deviceId: { type: string, format: uuid }
              receivedAt: { type: string, format: date-time }
              eventCount: { type: integer }
              events: { type: array, items: { $ref: '#/components/schemas/MeDiagnosticEvent' } }
        diagnosticsTruncated: { type: boolean, description: True when more than 10,000 events exist and the rest were left out }
        staffRoles:
          type: array
          items:
            type: object
            required: [role, grantedAt, revokedAt]
            properties:
              role: { type: string, enum: [support, catalog_editor, operator, admin, auditor] }
              grantedAt: { type: string, format: date-time }
              revokedAt: { type: [string, 'null'], format: date-time }
    MeDiagnosticEvent:
      type: object
      additionalProperties: false
      required: [eventId, eventName, schemaVersion, monotonicMs, sessionRandomId, networkClass, appBuild, osMajor, deviceClass]
      description: Doc 07 event. Unknown fields are refused. In responses durationMs and resultCode are always present (null when not sent).
      properties:
        eventId: { type: string, format: uuid, description: 'RFC 4122 UUID (version 1-8); unique within the batch; stored lowercase' }
        eventName: { type: string, enum: [import_completed, import_failed, playback_start_result, playback_stall, playback_recovered, app_error, purchase_result, carplay_session_result] }
        schemaVersion: { type: integer, const: 1 }
        monotonicMs: { type: integer, minimum: 0, maximum: 9007199254740991 }
        sessionRandomId: { type: string, pattern: '^[A-Za-z0-9_-]{8,64}$' }
        durationMs: { type: [integer, 'null'], minimum: 0, maximum: 86400000 }
        resultCode: { type: [string, 'null'], pattern: '^[A-Z][A-Z0-9_]{1,47}$', example: MEDIA_STALLED }
        networkClass: { type: string, enum: [wifi, cellular, offline] }
        appBuild: { type: string, pattern: '^[0-9A-Za-z.+-]{1,32}$' }
        osMajor: { type: integer, minimum: 0, maximum: 99 }
        deviceClass: { type: string, enum: [phone, tablet] }
    MeDiagnosticBatch:
      type: object
      additionalProperties: false
      required: [batchId, deviceId, consent, events]
      properties:
        batchId: { type: string, format: uuid, description: 'RFC 4122 UUID (version 1-8); reuse it when retrying the same batch' }
        deviceId: { type: string, format: uuid, description: 'A registered, non-revoked device of the caller (RFC 4122 UUID, version 1-8)' }
        consent: { type: boolean, const: true, description: The user agreed to this upload }
        events: { type: array, minItems: 1, maxItems: 100, items: { $ref: '#/components/schemas/MeDiagnosticEvent' } }
    MeDiagnosticUploadResult:
      type: object
      required: [reportId, accepted, duplicates]
      properties:
        reportId: { type: string, format: uuid }
        accepted: { type: integer, minimum: 0 }
        duplicates: { type: integer, minimum: 0, description: Events skipped because their eventId was already stored (all of them for a repeated batchId) }
    MeDiagnosticReport:
      type: object
      required: [id, receivedAt, expiresAt, deviceId, platform, eventCount, events]
      properties:
        id: { type: string, format: uuid }
        receivedAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time, description: receivedAt plus 7 days }
        deviceId: { type: string, format: uuid }
        platform: { type: [string, 'null'], enum: [ios, android, null], description: null when the device is gone }
        eventCount: { type: integer, minimum: 0 }
        events:
          type: array
          description: Count per event name, most frequent first
          items:
            type: object
            required: [eventName, count]
            properties:
              eventName: { type: string }
              count: { type: integer, minimum: 1 }
    MeDiagnosticReportDetail:
      allOf:
        - { $ref: '#/components/schemas/MeDiagnosticReport' }
        - type: object
          required: [items]
          properties:
            items: { type: array, items: { $ref: '#/components/schemas/MeDiagnosticEvent' } }
    MeDiagnosticsPage:
      type: object
      required: [reports, nextCursor, retentionDays]
      properties:
        reports: { type: array, items: { $ref: '#/components/schemas/MeDiagnosticReport' } }
        nextCursor: { type: [string, 'null'] }
        retentionDays: { type: integer, const: 7 }
    MeSupportGrant:
      type: object
      required: [id, grantedAt, expiresAt]
      properties:
        id: { type: string, format: uuid }
        grantedAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time, description: grantedAt plus 7 days }
    MeSupportAccessList:
      type: object
      required: [grants, codeMinutes, accessDays]
      properties:
        grants: { type: array, items: { $ref: '#/components/schemas/MeSupportGrant' } }
        codeMinutes: { type: integer, const: 60 }
        accessDays: { type: integer, const: 7 }
    MeSupportCode:
      type: object
      required: [code, expiresAt]
      properties:
        code: { type: string, pattern: '^[A-HJKMNP-TV-Z2-9]{4}-[A-HJKMNP-TV-Z2-9]{4}$', example: ABCD-EFGH, description: 'Read out to support; no 0, O, 1, I, L or U' }
        expiresAt: { type: string, format: date-time, description: 60 minutes from now }
    SyncFavoriteValue:
      type: object
      additionalProperties: false
      required: [stationId, order]
      properties:
        stationId: { type: string, format: uuid, description: 'A published, enabled station with current rights (checked when the station changes; else rejected / unknown_station)' }
        order: { type: integer, minimum: 0, maximum: 9999 }
    SyncChange:
      type: object
      additionalProperties: false
      required: [changeId, entityId, type, op, baseRevision]
      properties:
        changeId: { type: string, format: uuid, description: 'Unique per change; unique within the request; a replay returns the first result' }
        entityId: { type: string, format: uuid, description: 'The favorite''s id, chosen by the device on create' }
        type: { type: string, enum: [favorite] }
        op: { type: string, enum: [upsert, delete, restore] }
        baseRevision: { type: integer, minimum: 0, description: '0 creates (upsert only); otherwise the current revision the device last saw (delete and restore need ≥ 1; restore names the tombstone revision)' }
        value: { allOf: [{ $ref: '#/components/schemas/SyncFavoriteValue' }], nullable: true, description: 'Required for upsert and restore; absent or null for delete' }
    SyncPushRequest:
      type: object
      additionalProperties: false
      required: [changes]
      properties:
        deviceId: { type: string, format: uuid, description: The pushing device; must be registered to the caller and not revoked }
        changes: { type: array, minItems: 1, maxItems: 100, items: { $ref: '#/components/schemas/SyncChange' } }
    SyncEntityState:
      type: object
      required: [revision, value, deleted]
      properties:
        revision: { type: integer, minimum: 1 }
        value: { allOf: [{ $ref: '#/components/schemas/SyncFavoriteValue' }], nullable: true, description: null when deleted }
        deleted: { type: boolean }
    SyncResultApplied:
      type: object
      required: [changeId, entityId, status, revision]
      properties:
        changeId: { type: string, format: uuid }
        entityId: { type: string, format: uuid }
        status: { type: string, const: applied }
        revision: { type: integer, minimum: 1, description: The entity's new revision (baseRevision + 1) }
    SyncResultConflict:
      type: object
      required: [changeId, entityId, status, reason, current]
      properties:
        changeId: { type: string, format: uuid }
        entityId: { type: string, format: uuid }
        status: { type: string, const: conflict }
        reason:
          type: string
          enum: [exists, not_found, revision_mismatch, deleted, not_deleted, station_already_favorite]
          description: 'exists: create of an id that exists (live or deleted); not_found: no such entity; revision_mismatch: baseRevision is not current; deleted: upsert/delete of a tombstone; not_deleted: restore of a live entity; station_already_favorite: another live favorite has this station'
        current: { allOf: [{ $ref: '#/components/schemas/SyncEntityState' }], nullable: true, description: "The server's state of entityId; null when it does not exist" }
        existingEntityId: { type: string, format: uuid, description: 'Only with station_already_favorite, the live favorite holding that station' }
    SyncResultRejected:
      type: object
      required: [changeId, entityId, status, reason]
      properties:
        changeId: { type: string, format: uuid }
        entityId: { type: string, format: uuid }
        status: { type: string, const: rejected }
        reason: { type: string, enum: [unknown_station, change_id_reused] }
    SyncChangeResult:
      oneOf:
        - { $ref: '#/components/schemas/SyncResultApplied' }
        - { $ref: '#/components/schemas/SyncResultConflict' }
        - { $ref: '#/components/schemas/SyncResultRejected' }
      discriminator:
        propertyName: status
        mapping: { applied: '#/components/schemas/SyncResultApplied', conflict: '#/components/schemas/SyncResultConflict', rejected: '#/components/schemas/SyncResultRejected' }
    SyncPushResponse:
      type: object
      required: [results]
      properties:
        results: { type: array, items: { $ref: '#/components/schemas/SyncChangeResult' }, description: Same order and length as the request's changes }
    SyncPulledChange:
      type: object
      required: [entityId, type, revision, value, deleted, updatedAt]
      properties:
        entityId: { type: string, format: uuid }
        type: { type: string, enum: [favorite] }
        revision: { type: integer, minimum: 1 }
        value: { allOf: [{ $ref: '#/components/schemas/SyncFavoriteValue' }], nullable: true, description: null for a tombstone }
        deleted: { type: boolean, description: true for a tombstone }
        updatedAt: { type: string, format: date-time }
    SyncPullPage:
      type: object
      required: [changes, cursor, hasMore]
      properties:
        changes: { type: array, maxItems: 100, items: { $ref: '#/components/schemas/SyncPulledChange' }, description: 'Oldest first; each entity at most once, in its latest state' }
        cursor: { type: string, description: 'Opaque; always present (unchanged when the page is empty). Save it after applying the page' }
        hasMore: { type: boolean }
    SyncFavorite:
      type: object
      required: [entityId, revision, stationId, order, updatedAt]
      properties:
        entityId: { type: string, format: uuid }
        revision: { type: integer, minimum: 1 }
        stationId: { type: string, format: uuid }
        order: { type: integer, minimum: 0, maximum: 9999 }
        updatedAt: { type: string, format: date-time }
    SyncFavoriteList:
      type: object
      required: [favorites]
      properties:
        favorites: { type: array, items: { $ref: '#/components/schemas/SyncFavorite' } }
    BillingVerifyApple:
      type: object
      additionalProperties: false
      required: [store, signedTransaction]
      properties:
        store: { type: string, const: apple }
        signedTransaction: { type: string, maxLength: 32768, pattern: '^[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+$', description: StoreKit 2 JWSTransaction (compact JWS) }
    BillingVerifyGoogle:
      type: object
      additionalProperties: false
      required: [store, productId, purchaseToken]
      properties:
        store: { type: string, const: google }
        productId: { type: string, pattern: '^[A-Za-z0-9._]{1,100}$' }
        purchaseToken: { type: string, pattern: '^[A-Za-z0-9._:-]{10,4096}$' }
    BillingVerifyRequest:
      oneOf:
        - { $ref: '#/components/schemas/BillingVerifyApple' }
        - { $ref: '#/components/schemas/BillingVerifyGoogle' }
      discriminator:
        propertyName: store
        mapping: { apple: '#/components/schemas/BillingVerifyApple', google: '#/components/schemas/BillingVerifyGoogle' }
    BillingPurchase:
      type: object
      required: [store, productId, state, environment, purchasedAt, verifiedAt, revokedAt]
      properties:
        store: { type: string, enum: [apple, google] }
        productId: { type: string }
        state: { type: string, enum: [verified, pending, revoked] }
        environment: { type: string, enum: [production, sandbox] }
        purchasedAt: { type: string, format: date-time, nullable: true }
        verifiedAt: { type: string, format: date-time, nullable: true }
        revokedAt: { type: string, format: date-time, nullable: true }
    BillingEntitlements:
      type: object
      required: [pro, purchases]
      properties:
        pro:
          type: object
          required: [apple, google]
          properties:
            apple: { type: string, enum: [verified, pending, revoked, none] }
            google: { type: string, enum: [verified, pending, revoked, none] }
        purchases: { type: array, items: { $ref: '#/components/schemas/BillingPurchase' }, description: Oldest first }
    BillingAppleNotification:
      type: object
      required: [signedPayload]
      properties:
        signedPayload: { type: string, description: 'App Store Server Notifications V2 signed payload (compact JWS, ES256, x5c chain to Apple Root CA - G3)' }
    BillingPubSubPush:
      type: object
      required: [message]
      properties:
        message:
          type: object
          required: [messageId, data]
          properties:
            messageId: { type: string, description: Used to recognize redeliveries }
            data: { type: string, contentEncoding: base64, description: 'Base64 of the DeveloperNotification JSON (packageName, oneTimeProductNotification {notificationType, purchaseToken, sku}, voidedPurchaseNotification {purchaseToken}, testNotification)' }
        subscription: { type: string }
    BillingWebhookAck:
      type: object
      required: [ok]
      properties: { ok: { type: boolean, const: true } }
    ConfigPayload:
      type: object
      additionalProperties: false
      required: [minSupportedBuild, features, catalogRefreshHours]
      properties:
        minSupportedBuild:
          type: object
          additionalProperties: false
          required: [ios, android]
          description: Builds below this build number are asked to update before using online features; null = no minimum
          properties:
            ios: { type: integer, minimum: 1, maximum: 2147483647, nullable: true }
            android: { type: integer, minimum: 1, maximum: 2147483647, nullable: true }
        features:
          type: object
          additionalProperties: false
          required: [catalogBrowse, playlistImport, diagnosticsUpload]
          description: Disable-only switches. true = the build's default (on); false turns a shipped feature off
          properties:
            catalogBrowse: { type: boolean }
            playlistImport: { type: boolean }
            diagnosticsUpload: { type: boolean }
        catalogRefreshHours: { type: integer, minimum: 1, maximum: 168, description: How often the app refreshes the radio catalog in the foreground }
    ConfigTarget:
      type: object
      additionalProperties: false
      required: [include, minBuild, maxBuild]
      properties:
        include: { type: boolean }
        minBuild: { type: integer, minimum: 1, maximum: 2147483647, nullable: true }
        maxBuild: { type: integer, minimum: 1, maximum: 2147483647, nullable: true }
    ConfigTargets:
      type: object
      additionalProperties: false
      required: [ios, android]
      description: Which apps a release is for; a client outside it keeps the newest release that fits it
      properties:
        ios: { $ref: '#/components/schemas/ConfigTarget' }
        android: { $ref: '#/components/schemas/ConfigTarget' }
    ConfigDocument:
      type: object
      required: [jws, schemaVersion, release, environment, targets, publishedAt, expiresAt, config]
      description: Everything except jws is a convenience copy of the JWS payload, for debugging; apps act only on the verified payload, which holds exactly these fields without jws
      properties:
        jws: { type: string, description: 'Compact JWS, header {alg: EdDSA, kid, typ: tunedeck-config+jws}' }
        schemaVersion: { type: integer, const: 1 }
        release: { type: integer, minimum: 0, description: '0 = no fitting release, built-in defaults' }
        environment: { type: string, enum: [production, staging], description: The channel asked for }
        targets: { $ref: '#/components/schemas/ConfigTargets' }
        publishedAt: { type: string, format: date-time, nullable: true, description: null for release 0 }
        expiresAt: { type: string, format: date-time, nullable: true, description: 'null for release 0; after it apps use their built-in defaults' }
        config: { $ref: '#/components/schemas/ConfigPayload' }
    PublicStation:
      type: object
      required: [id, revision, name, country, language, genres, streamUrl, codec, bitrateKbps]
      properties:
        id: { type: string, format: uuid }
        revision: { type: integer, minimum: 1, description: The published revision }
        name: { type: string, minLength: 1, maxLength: 80 }
        country: { type: string, pattern: '^[A-Z]{2}$' }
        language: { type: string, pattern: '^[a-z]{2,3}$' }
        genres: { type: array, maxItems: 5, items: { type: string, pattern: '^[a-z0-9-]{2,24}$' } }
        streamUrl: { type: string, format: uri, maxLength: 2048, description: 'https, port 443, public host name' }
        codec: { type: string, enum: [mp3, aac, hls] }
        bitrateKbps: { type: integer, minimum: 8, maximum: 512, nullable: true }
    CatalogPage:
      type: object
      required: [stations, nextCursor]
      properties:
        stations: { type: array, maxItems: 100, items: { $ref: '#/components/schemas/PublicStation' } }
        nextCursor: { type: string, nullable: true, description: null on the last page }
    StationDraft:
      type: object
      additionalProperties: false
      required: [name, country, language, streamUrl, codec]
      description: 'Create body. genres defaults to [] and bitrateKbps to null. Text is NFC-normalized and trimmed before the length check; control characters and bidi overrides are refused.'
      properties:
        name: { type: string, minLength: 1, maxLength: 80 }
        country: { type: string, pattern: '^[A-Z]{2}$', description: ISO 3166 alpha-2 }
        language: { type: string, pattern: '^[a-z]{2,3}$', description: ISO 639 }
        genres: { type: array, maxItems: 5, items: { type: string, pattern: '^[a-z0-9-]{2,24}$' }, description: Duplicates are dropped }
        streamUrl: { type: string, format: uri, maxLength: 2048, description: 'https only, port 443 (or none), no credentials, no fragment, no IP literal, a host name with a dot that is not localhost or .local/.internal/.localdomain/.home.arpa. Fetched only by the bounded stream health check.' }
        codec: { type: string, enum: [mp3, aac, hls] }
        bitrateKbps: { type: [integer, 'null'], minimum: 8, maximum: 512 }
    StationPatch:
      type: object
      additionalProperties: false
      minProperties: 1
      description: 'Draft edit; same field rules as StationDraft. {} is 400 empty_patch.'
      properties:
        name: { type: string, minLength: 1, maxLength: 80 }
        country: { type: string, pattern: '^[A-Z]{2}$' }
        language: { type: string, pattern: '^[a-z]{2,3}$' }
        genres: { type: array, maxItems: 5, items: { type: string, pattern: '^[a-z0-9-]{2,24}$' } }
        streamUrl: { type: string, format: uri, maxLength: 2048 }
        codec: { type: string, enum: [mp3, aac, hls] }
        bitrateKbps: { type: [integer, 'null'], minimum: 8, maximum: 512 }
    AdminStationSnapshot:
      type: object
      description: A stored draft or published snapshot (all fields present)
      required: [name, country, language, genres, streamUrl, codec, bitrateKbps]
      properties:
        name: { type: string }
        country: { type: string }
        language: { type: string }
        genres: { type: array, items: { type: string } }
        streamUrl: { type: string, format: uri }
        codec: { type: string, enum: [mp3, aac, hls] }
        bitrateKbps: { type: [integer, 'null'] }
    AdminStationPublish:
      type: object
      additionalProperties: false
      required: [reason]
      properties:
        reason: { type: string, minLength: 1, maxLength: 500, description: 'Trimmed; at least 20 characters when emergency is true' }
        emergency: { type: boolean, default: false, description: 'Lets an admin publish their own change alone (skips only own_change); audited as station.publish_emergency. Ignored (ordinary publish) when the caller has no own_change.' }
    AdminStation:
      type: object
      required: [id, revision, status, draft, published, publishedRevision, publishedAt, disabledAt, updatedAt, publishBlockers, rights, health]
      properties:
        id: { type: string, format: uuid }
        revision: { type: integer, minimum: 1, description: Draft revision (also the ETag) }
        status: { type: string, enum: [draft, published, changes_pending, disabled] }
        draft: { $ref: '#/components/schemas/AdminStationSnapshot' }
        published: { anyOf: [{ $ref: '#/components/schemas/AdminStationSnapshot' }, { type: 'null' }] }
        publishedRevision: { type: [integer, 'null'] }
        publishedAt: { type: [string, 'null'], format: date-time }
        disabledAt: { type: [string, 'null'], format: date-time }
        updatedAt: { type: string, format: date-time }
        publishBlockers:
          type: array
          description: Why the caller could not publish now; empty when they can
          items: { type: string, enum: [admin_role_required, own_change, already_published, rights_missing, rights_territory, rights_not_yet_valid, rights_expired] }
        rights:
          type: object
          required: [state, expiresAt, reference, liveUntil]
          properties:
            state: { type: string, enum: [current, missing, territory, not_yet_valid, expired], description: "The draft country's rights from the station's records" }
            expiresAt: { type: [string, 'null'], format: date, description: End date of the record that decides state }
            reference: { type: [string, 'null'] }
            liveUntil: { type: [string, 'null'], format: date-time, description: Until when the public catalog may serve the published station; null means no end }
        health: { $ref: '#/components/schemas/AdminStationHealth' }
    AdminStationPage:
      type: object
      required: [stations, nextCursor]
      properties:
        stations: { type: array, items: { $ref: '#/components/schemas/AdminStation' } }
        nextCursor: { type: [string, 'null'] }
    AdminStationHealth:
      type: object
      description: 'Health of the published stream from checks since the last publish (draft checks never count). unknown when there are none.'
      required: [state, regions]
      properties:
        state: { type: string, enum: [unknown, ok, failing, suspect], description: Worst region; suspect after 3 failures in a row }
        regions:
          type: array
          items:
            type: object
            required: [region, state, checkedAt, reason, httpStatus, latencyMs, consecutiveFailures]
            properties:
              region: { type: string }
              state: { type: string, enum: [ok, failing, suspect] }
              checkedAt: { type: string, format: date-time }
              reason: { $ref: '#/components/schemas/AdminProbeReason' }
              httpStatus: { type: [integer, 'null'] }
              latencyMs: { type: [integer, 'null'] }
              consecutiveFailures: { type: integer, minimum: 0, maximum: 3 }
    AdminProbeReason:
      type: string
      enum: [ok, invalid_url, dns_failed, blocked_address, timeout, connect_failed, http_status, too_many_redirects, not_audio]
    AdminStationCheck:
      type: object
      required: [region, checkedAt, target, ok, reason, httpStatus, latencyMs]
      properties:
        region: { type: string }
        checkedAt: { type: string, format: date-time }
        target: { type: string, enum: [published, draft] }
        ok: { type: boolean }
        reason: { $ref: '#/components/schemas/AdminProbeReason' }
        httpStatus: { type: [integer, 'null'] }
        latencyMs: { type: [integer, 'null'] }
    AdminStationHistoryEntry:
      type: object
      required: [id, occurredAt, action, actor, actorSubject, reason, revision, changes]
      properties:
        id: { type: string, description: Audit event id (decimal string) }
        occurredAt: { type: string, format: date-time }
        action: { type: string, example: station.publish, description: 'station.create, station.update, station.publish, station.publish_emergency, station.disable, station.enable, station.check, rights.add, rights.revoke' }
        actor: { type: string, example: 'user:6f0c…', description: 'user:<internal id>, operator:<label> or a system actor' }
        actorSubject: { type: [string, 'null'], description: OIDC subject of a user actor; null for operators and the system }
        reason: { type: [string, 'null'] }
        revision: { type: [integer, 'null'], description: changes.revision when it is a number }
        changes: { type: object }
    NewRightsRecord:
      type: object
      additionalProperties: false
      required: [holder, basis, reference, territories]
      properties:
        holder: { type: string, minLength: 1, maxLength: 200 }
        basis: { type: string, enum: [owner_permission, broadcaster_terms, licensed_aggregator, owned_demo] }
        reference: { type: string, minLength: 1, maxLength: 200, description: 'Where the evidence is kept, not the evidence' }
        territories: { type: array, minItems: 1, maxItems: 250, items: { type: string, pattern: '^[A-Z]{2}$' }, description: ISO 3166 alpha-2; de-duplicated and sorted }
        validFrom: { type: string, format: date, description: 'YYYY-MM-DD; defaults to today (UTC)' }
        expiresAt: { type: [string, 'null'], format: date, description: 'Valid through this whole day (UTC); null or absent for no end; not before validFrom' }
        evidenceRefs: { type: array, maxItems: 10, items: { type: string, maxLength: 200, pattern: '^[A-Za-z0-9][A-Za-z0-9._-]*(/[A-Za-z0-9._-]+)*$' }, description: 'Opaque private storage keys, never URLs; no . or .. segments' }
    RightsRecord:
      type: object
      required: [id, holder, basis, reference, territories, validFrom, expiresAt, status, effectiveStatus, evidenceCount, createdBy, createdAt, updatedBy, updatedAt, revokedBy, revokedAt, revokeReason]
      properties:
        id: { type: string, format: uuid }
        holder: { type: string }
        basis: { type: string, enum: [owner_permission, broadcaster_terms, licensed_aggregator, owned_demo] }
        reference: { type: string }
        territories: { type: array, items: { type: string } }
        validFrom: { type: string, format: date }
        expiresAt: { type: [string, 'null'], format: date }
        status: { type: string, enum: [active, revoked] }
        effectiveStatus: { type: string, enum: [active, scheduled, expired, revoked] }
        evidenceCount: { type: integer, minimum: 0, maximum: 10 }
        evidenceRefs: { type: array, items: { type: string }, description: Only in GET .../rights }
        createdBy: { type: [string, 'null'], description: OIDC subject; null for records back-filled by migration 024 }
        createdAt: { type: string, format: date-time }
        updatedBy: { type: [string, 'null'] }
        updatedAt: { type: string, format: date-time }
        revokedBy: { type: [string, 'null'] }
        revokedAt: { type: [string, 'null'], format: date-time }
        revokeReason: { type: [string, 'null'] }
    AdminExportReason:
      type: object
      required: [reason]
      description: 'Reason for an export, a job retry and similar recorded actions. Trimmed, then 10 to 500 characters with no control characters. Other fields are ignored.'
      properties:
        reason: { type: string, minLength: 10, maxLength: 500 }
    AdminAuditEvent:
      type: object
      required: [id, occurredAt, actor, actorSubject, action, targetLabel, targetType, targetId, reason, changes, requestId]
      properties:
        id: { type: string, description: Decimal string }
        occurredAt: { type: string, format: date-time }
        actor: { type: string, description: 'user:<internal id>, operator:<label> or a system actor' }
        actorSubject: { type: [string, 'null'], description: OIDC subject of a user actor }
        action: { type: string, example: station.publish }
        targetLabel: { type: [string, 'null'], description: Station name or account subject when the target still exists }
        targetType: { type: string }
        targetId: { type: string }
        reason: { type: [string, 'null'] }
        changes: { type: object }
        requestId: { type: [string, 'null'] }
    AdminLogLine:
      type: object
      required: [id, timestamp, severity, service, environment, build, eventCode, requestId, traceId, method, route, status, durationMs, actorId, errorName, errorCode]
      properties:
        id: { type: string, description: Decimal string }
        timestamp: { type: string, format: date-time }
        severity: { type: string, enum: [DEBUG, INFO, WARN, ERROR] }
        service: { type: string }
        environment: { type: string }
        build: { type: string }
        eventCode: { type: string, example: HTTP_REQUEST }
        requestId: { type: [string, 'null'] }
        traceId: { type: [string, 'null'] }
        method: { type: [string, 'null'] }
        route: { type: [string, 'null'], description: 'Route template, never the raw URL' }
        status: { type: [integer, 'null'] }
        durationMs: { type: [integer, 'null'] }
        actorId: { type: [string, 'null'], description: Internal user id }
        errorName: { type: [string, 'null'] }
        errorCode: { type: [string, 'null'] }
    AdminMetricsCounts:
      type: object
      required: [requests, serverErrors, clientErrors, errorRate, p50UpToMs, p95UpToMs, latencyBuckets]
      properties:
        requests: { type: integer }
        serverErrors: { type: integer }
        clientErrors: { type: integer }
        errorRate: { type: [number, 'null'], description: 5xx share of requests; null without requests }
        p50UpToMs: { type: [integer, 'null'], description: Upper bound of the latency slot holding the median; null without requests or above 5000 ms }
        p95UpToMs: { type: [integer, 'null'] }
        latencyBuckets: { type: array, minItems: 8, maxItems: 8, items: { type: integer }, description: 'Counts per slot: <=50, 100, 250, 500, 1000, 2500, 5000 ms, slower' }
    AdminMetrics:
      type: object
      required: [from, to, bucket, latencyBoundsMs, totals, series, routes, retentionDays]
      properties:
        from: { type: string, format: date-time }
        to: { type: string, format: date-time }
        bucket: { type: string, enum: [1h, 1d] }
        latencyBoundsMs: { type: array, items: { type: integer }, example: [50, 100, 250, 500, 1000, 2500, 5000] }
        totals: { $ref: '#/components/schemas/AdminMetricsCounts' }
        series: { type: array, items: { allOf: [{ $ref: '#/components/schemas/AdminMetricsCounts' }, { type: object, required: [at], properties: { at: { type: string, format: date-time } } }] }, description: Only buckets with data }
        routes: { type: array, maxItems: 50, items: { allOf: [{ $ref: '#/components/schemas/AdminMetricsCounts' }, { type: object, required: [method, route], properties: { method: { type: string }, route: { type: string } } }] } }
        retentionDays: { type: integer, const: 90 }
    AdminOverview:
      type: object
      required: [window, generatedAt, api, stations, queues, clients, incidents]
      properties:
        window:
          type: object
          required: [id, from, to]
          properties:
            id: { type: string, enum: [1h, 24h, 7d] }
            from: { type: string, format: date-time }
            to: { type: string, format: date-time }
        generatedAt: { type: string, format: date-time }
        api:
          type: object
          required: [requests, serverErrors, clientErrors, errorRate, p50Ms, p95Ms, lastRequestAt, stale, buckets, topErrors]
          properties:
            requests: { type: integer }
            serverErrors: { type: integer }
            clientErrors: { type: integer }
            errorRate: { type: [number, 'null'] }
            p50Ms: { type: [integer, 'null'] }
            p95Ms: { type: [integer, 'null'] }
            lastRequestAt: { type: [string, 'null'], format: date-time }
            stale: { type: boolean, description: No request logged for 15 minutes }
            buckets:
              type: array
              description: Every bucket of the window, empty ones as zero
              items:
                type: object
                required: [at, requests, serverErrors, p95Ms]
                properties:
                  at: { type: string, format: date-time }
                  requests: { type: integer }
                  serverErrors: { type: integer }
                  p95Ms: { type: [integer, 'null'] }
            topErrors:
              type: array
              maxItems: 5
              items:
                type: object
                required: [route, status, count]
                properties:
                  route: { type: [string, 'null'] }
                  status: { type: integer }
                  count: { type: integer }
        stations:
          type: object
          required: [published, disabled, health, checkerEnabled, lastCheckAt]
          properties:
            published: { type: integer, description: Published and enabled }
            disabled: { type: integer, description: Published but disabled }
            health:
              type: object
              required: [ok, failing, suspect, unknown]
              properties: { ok: { type: integer }, failing: { type: integer }, suspect: { type: integer }, unknown: { type: integer } }
            checkerEnabled: { type: boolean }
            lastCheckAt: { type: [string, 'null'], format: date-time }
        queues:
          type: object
          required: [accountDeletions, diagnosticReports]
          properties:
            accountDeletions:
              type: object
              required: [open, failed, oldestRequestedAt, deadlineDays]
              properties:
                open: { type: integer }
                failed: { type: integer, description: Retrying or dead-lettered }
                oldestRequestedAt: { type: [string, 'null'], format: date-time }
                deadlineDays: { type: integer, example: 30 }
            diagnosticReports: { type: integer, description: Reports received in the window }
        clients:
          type: object
          description: 'Opt-in app diagnostics received in the window (Doc 07 numerator/denominator). A failure is an event with any resultCode. Counts and distinct-device counts only.'
          required: [reports, devices, events, byEvent, topFailures, builds]
          properties:
            reports: { type: integer }
            devices: { type: integer, description: Distinct reporting devices }
            events: { type: integer }
            byEvent:
              type: array
              description: Every event name seen, most frequent first
              items:
                type: object
                required: [eventName, events, failures, devices]
                properties: { eventName: { type: string }, events: { type: integer }, failures: { type: integer }, devices: { type: integer } }
            topFailures:
              type: array
              maxItems: 10
              items:
                type: object
                required: [eventName, resultCode, count, devices]
                properties: { eventName: { type: string }, resultCode: { type: string }, count: { type: integer }, devices: { type: integer } }
            builds:
              type: array
              maxItems: 5
              description: Busiest app builds by event count, per platform
              items:
                type: object
                required: [appBuild, platform, events, failures]
                properties: { appBuild: { type: string }, platform: { type: string, enum: [ios, android] }, events: { type: integer }, failures: { type: integer } }
        incidents:
          type: array
          items:
            type: object
            required: [code, severity, count]
            properties:
              code: { type: string, enum: [api_error_rate, api_latency, stations_suspect, station_checker_stale, account_deletion_failed, account_deletion_stuck, account_deletion_late, account_export_stuck, idp_session_end_stuck, job_dead_letter, station_rights_expiring, backup_stale, no_recent_traffic] }
              severity: { type: string, enum: [critical, warning] }
              count: { type: integer, description: 'Affected things (stations, requests, deletions; p95 ms for api_latency); meaning depends on code' }
              since: { type: string, format: date-time, description: Present when the incident is an open alert }
    AdminJob:
      type: object
      required: [id, kind, status, requestedAt, attempts, maxAttempts, lastAttemptAt, nextAttemptAt, lastErrorCode, completedAt, deadline]
      properties:
        id: { type: string, description: 'Opaque: a deletion ticket hash, ex_<export id> or se_<sha256>; never a user, device or Keycloak session id' }
        kind: { type: string, enum: [account_deletion, account_export, idp_session_end] }
        status: { type: string, enum: [pending, retrying, dead_letter, completed] }
        requestedAt: { type: string, format: date-time }
        attempts: { type: integer, description: Attempts in the current round }
        maxAttempts: { type: integer, const: 5 }
        lastAttemptAt: { type: [string, 'null'], format: date-time }
        nextAttemptAt: { type: [string, 'null'], format: date-time, description: 'Null when dead-lettered, completed or not yet scheduled' }
        lastErrorCode: { type: [string, 'null'], description: 'A code only, e.g. IDP_DELETE_FAILED, DB_40001' }
        completedAt: { type: [string, 'null'], format: date-time }
        deadline: { type: [string, 'null'], format: date-time, description: Account deletions only (30 days from the request) }
    AdminJobList:
      type: object
      required: [jobs, counts, queues, truncated]
      properties:
        jobs: { type: array, maxItems: 100, items: { $ref: '#/components/schemas/AdminJob' } }
        counts:
          type: object
          description: All listed jobs by status, whatever the filter
          required: [pending, retrying, dead_letter, completed]
          properties: { pending: { type: integer }, retrying: { type: integer }, dead_letter: { type: integer }, completed: { type: integer } }
        queues:
          type: array
          items:
            type: object
            required: [kind, pending, retrying, deadLetter, oldestOpenAt]
            properties:
              kind: { type: string, enum: [account_deletion, account_export, idp_session_end] }
              pending: { type: integer }
              retrying: { type: integer }
              deadLetter: { type: integer }
              oldestOpenAt: { type: [string, 'null'], format: date-time }
        truncated: { type: boolean, description: More than 100 jobs matched }
    AdminUserLookupRequest:
      type: object
      required: [query, reason]
      description: Other fields are ignored
      properties:
        query: { type: string, maxLength: 320, description: 'A user id or device id (UUID), or an email address; trimmed' }
        reason: { type: string, minLength: 10, maxLength: 500, description: 'Trimmed; no control characters' }
    AdminUserSupportView:
      type: object
      required: [matchedBy, user, settings, devices, diagnostics, deletion]
      properties:
        matchedBy: { type: string, enum: [user, device, email] }
        user:
          type: object
          required: [id, email, emailVerified, status, createdAt, deletedAt]
          properties:
            id: { type: string, format: uuid }
            email: { type: [string, 'null'] }
            emailVerified: { type: boolean }
            status: { type: string, enum: [active, deleting, deleted, disabled] }
            createdAt: { type: string, format: date-time }
            deletedAt: { type: [string, 'null'], format: date-time }
        settings:
          type: object
          required: [revision, updatedAt]
          properties:
            revision: { type: integer, minimum: 0 }
            updatedAt: { type: [string, 'null'], format: date-time }
        devices:
          type: array
          description: Active first, then most recently seen
          items:
            type: object
            required: [id, platform, osMajor, appBuild, appliedSettingsRevision, inSync, createdAt, lastSeenAt, revokedAt]
            properties:
              id: { type: string, format: uuid }
              platform: { type: string, enum: [ios, android] }
              osMajor: { type: integer }
              appBuild: { type: string }
              appliedSettingsRevision: { type: integer }
              inSync: { type: boolean, description: Applied the latest settings revision }
              createdAt: { type: string, format: date-time }
              lastSeenAt: { type: string, format: date-time }
              revokedAt: { type: [string, 'null'], format: date-time }
        diagnostics:
          type: object
          required: [reportsLast7Days, access]
          properties:
            reportsLast7Days: { type: integer }
            access:
              description: "The caller's own running access to this customer's reports; null if none"
              anyOf:
                - { type: object, required: [id, expiresAt], properties: { id: { type: string, format: uuid }, expiresAt: { type: string, format: date-time } } }
                - { type: 'null' }
        deletion:
          description: Latest account deletion request, or null
          anyOf:
            - { type: object, required: [status, requestedAt], properties: { status: { type: string, enum: [pending, failed, dead_letter, completed] }, requestedAt: { type: string, format: date-time } } }
            - { type: 'null' }
    AdminSupportAccessRequest:
      type: object
      required: [code, reason]
      properties:
        code: { type: string, example: ABCD-EF23, description: 'The customer''s 8-character code (alphabet ABCDEFGHJKMNPQRSTVWXYZ23456789), any case, dash and spaces ignored; valid for 60 minutes after it was made' }
        reason: { type: string, minLength: 10, maxLength: 500, description: 'Trimmed; no control characters' }
    AdminSupportGrant:
      type: object
      required: [id, grantedAt, expiresAt]
      properties:
        id: { type: string, format: uuid }
        grantedAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time, description: 7 days after grantedAt }
    AdminSupportDiagnostics:
      type: object
      required: [access, reports, retentionDays]
      properties:
        access: { $ref: '#/components/schemas/AdminSupportGrant' }
        retentionDays: { type: integer, const: 7 }
        reports:
          type: array
          maxItems: 20
          items:
            type: object
            required: [id, receivedAt, expiresAt, deviceId, platform, eventCount, events, items]
            properties:
              id: { type: string, format: uuid }
              receivedAt: { type: string, format: date-time }
              expiresAt: { type: string, format: date-time }
              deviceId: { type: string, format: uuid }
              platform: { type: [string, 'null'], enum: [ios, android, null] }
              eventCount: { type: integer }
              events: { type: array, description: Counts per event name, items: { type: object, required: [eventName, count], properties: { eventName: { type: string }, count: { type: integer } } } }
              items:
                type: array
                description: The report's events in order, without event or session ids
                items:
                  type: object
                  required: [eventName, monotonicMs, durationMs, resultCode, networkClass, appBuild, osMajor, deviceClass]
                  properties:
                    eventName: { type: string }
                    monotonicMs: { type: integer }
                    durationMs: { type: [integer, 'null'] }
                    resultCode: { type: [string, 'null'] }
                    networkClass: { type: string, enum: [wifi, cellular, offline] }
                    appBuild: { type: string }
                    osMajor: { type: integer }
                    deviceClass: { type: string, enum: [phone, tablet] }
    AdminConfigPayload:
      type: object
      required: [minSupportedBuild, features, catalogRefreshHours]
      properties:
        minSupportedBuild:
          type: object
          required: [ios, android]
          properties:
            ios: { type: [integer, 'null'], minimum: 1, maximum: 2147483647, description: Builds below this are asked to update; null = no minimum }
            android: { type: [integer, 'null'], minimum: 1, maximum: 2147483647 }
        features:
          type: object
          required: [catalogBrowse, playlistImport, diagnosticsUpload]
          description: 'Disable-only switches: true = the build''s default, false turns a shipped feature off'
          properties: { catalogBrowse: { type: boolean }, playlistImport: { type: boolean }, diagnosticsUpload: { type: boolean } }
        catalogRefreshHours: { type: integer, minimum: 1, maximum: 168 }
    AdminConfigTargets:
      type: object
      required: [ios, android]
      description: Which apps a release is for
      properties:
        ios: { $ref: '#/components/schemas/AdminConfigPlatformTarget' }
        android: { $ref: '#/components/schemas/AdminConfigPlatformTarget' }
    AdminConfigPlatformTarget:
      type: object
      required: [include, minBuild, maxBuild]
      properties:
        include: { type: boolean }
        minBuild: { type: [integer, 'null'], minimum: 1, maximum: 2147483647 }
        maxBuild: { type: [integer, 'null'], minimum: 1, maximum: 2147483647 }
    AdminConfigDraftPatch:
      type: object
      additionalProperties: false
      description: 'Any subset; nested objects are partial too. Targets must keep at least one platform included (no_platform) and maxBuild >= minBuild (below_min_build).'
      properties:
        minSupportedBuild:
          type: object
          additionalProperties: false
          properties:
            ios: { type: [integer, 'null'], minimum: 1, maximum: 2147483647 }
            android: { type: [integer, 'null'], minimum: 1, maximum: 2147483647 }
        features:
          type: object
          additionalProperties: false
          properties: { catalogBrowse: { type: boolean }, playlistImport: { type: boolean }, diagnosticsUpload: { type: boolean } }
        catalogRefreshHours: { type: integer, minimum: 1, maximum: 168 }
        targets:
          type: object
          additionalProperties: false
          properties:
            ios: { type: object, additionalProperties: false, properties: { include: { type: boolean }, minBuild: { type: [integer, 'null'], minimum: 1, maximum: 2147483647 }, maxBuild: { type: [integer, 'null'], minimum: 1, maximum: 2147483647 } } }
            android: { type: object, additionalProperties: false, properties: { include: { type: boolean }, minBuild: { type: [integer, 'null'], minimum: 1, maximum: 2147483647 }, maxBuild: { type: [integer, 'null'], minimum: 1, maximum: 2147483647 } } }
    AdminConfigReleaseRequest:
      type: object
      additionalProperties: false
      required: [reason]
      properties:
        reason: { type: string, minLength: 10, maxLength: 500, description: 'NFC-normalized and trimmed; no control characters' }
        validDays: { type: integer, minimum: 7, maximum: 90, default: 30, description: Sets the release's expiresAt }
    AdminConfigPublishRequest:
      type: object
      additionalProperties: false
      required: [reason]
      properties:
        reason: { type: string, minLength: 10, maxLength: 500, description: 'NFC-normalized and trimmed; at least 20 characters when emergency is true' }
        validDays: { type: integer, minimum: 7, maximum: 90, default: 30 }
        emergency: { type: boolean, default: false, description: 'Lets an author publish alone (skips only own_change); audited as config.publish_emergency' }
    AdminConfigRelease:
      type: object
      required: [release, schemaVersion, environment, targets, config, stagedRelease, reviewed, emergency, rollbackOf, draftRevision, publishedAt, expiresAt, reason, publishedByYou]
      properties:
        release: { type: integer }
        schemaVersion: { type: integer, example: 1 }
        environment: { type: string, enum: [staging, production] }
        targets: { $ref: '#/components/schemas/AdminConfigTargets' }
        config: { $ref: '#/components/schemas/AdminConfigPayload' }
        stagedRelease: { type: [integer, 'null'], description: 'For a production release, the staging release it promoted' }
        reviewed: { type: boolean, description: 'A different admin approved it (false for staging, rollbacks and emergencies)' }
        emergency: { type: boolean }
        rollbackOf: { type: [integer, 'null'] }
        draftRevision: { type: [integer, 'null'] }
        publishedAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time }
        reason: { type: string }
        publishedByYou: { type: boolean }
    AdminConfigView:
      type: object
      required: [draft, current, staged, stagedIsDraft, stageBlockers, releases, publishBlockers, defaults, signingKeyId]
      properties:
        draft:
          type: object
          required: [config, targets, revision, updatedAt, changedSinceRelease]
          properties:
            config: { $ref: '#/components/schemas/AdminConfigPayload' }
            targets: { $ref: '#/components/schemas/AdminConfigTargets' }
            revision: { type: integer, minimum: 0 }
            updatedAt: { type: [string, 'null'], format: date-time, description: Null at revision 0 }
            changedSinceRelease: { type: array, items: { type: string }, example: [features.playlistImport, targets.android.minBuild], description: Dotted paths that differ from the current production release (or the defaults) }
        current: { anyOf: [{ $ref: '#/components/schemas/AdminConfigRelease' }, { type: 'null' }], description: The newest production release }
        staged: { anyOf: [{ $ref: '#/components/schemas/AdminConfigRelease' }, { type: 'null' }], description: The newest staging release }
        stagedIsDraft: { type: boolean, description: The staged release is the draft as it is now (required before production) }
        stageBlockers: { type: array, items: { type: string, enum: [admin_role_required, already_staged, no_changes] } }
        releases: { type: array, maxItems: 20, items: { $ref: '#/components/schemas/AdminConfigRelease' }, description: 'The last 20 releases, both channels, newest first' }
        publishBlockers: { type: array, items: { type: string, enum: [admin_role_required, own_change, no_changes, not_staged] } }
        defaults: { $ref: '#/components/schemas/AdminConfigPayload' }
        signingKeyId: { type: string }
  responses:
    Error:
      description: Error envelope
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
