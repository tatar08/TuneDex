# COL-01 contract PROPOSAL for COL-00 review (Codex owns the shared copy in packages/api_contracts).
# Nothing here is locked until both sides agree; the API in this folder implements exactly this.
# test/openapi.test.ts fails when a served route is missing here or a documented one is not served.
#
# Applies to every signed-in route and is not repeated per route: 429 API_RATE_LIMITED with Retry-After
# (120 reads / 30 writes a minute per account), 403 ACCOUNT_DELETING / AUTH_FORBIDDEN / DEVICE_REVOKED from
# the sign-in checks, 503 DEPENDENCY_UNAVAILABLE when the token keys cannot be fetched. Every /v1/admin route
# also needs a staff role (403 ROLE_REQUIRED) and an MFA sign-in within 12 hours (401 MFA_REQUIRED, scope session).
openapi: 3.1.0
info:
  title: TuneDeck API
  version: 0.2.0-proposal
servers:
  - url: /
paths:
  /health/live:
    get:
      summary: Process is running
      security: []
      responses:
        '200': { description: Live, content: { application/json: { schema: { $ref: '#/components/schemas/Health' } } } }
  /health/ready:
    get:
      summary: Process can serve traffic (database reachable)
      security: []
      responses:
        '200': { description: Ready, content: { application/json: { schema: { $ref: '#/components/schemas/Health' } } } }
        '503': { description: Not ready, content: { application/json: { schema: { $ref: '#/components/schemas/Health' } } } }
  /v1/me:
    get:
      summary: The signed-in account (the account code customers read out to support)
      description: No OIDC subject and no roles. The email is the access token's email claim, stored at sign-in.
      responses:
        '200':
          description: Account
          headers:
            Cache-Control: { schema: { type: string, example: no-store } }
          content: { application/json: { schema: { $ref: '#/components/schemas/MeAccount' } } }
        '401': { description: AUTH_REQUIRED, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '403': { description: 'ACCOUNT_DELETING, AUTH_FORBIDDEN (account disabled) or DEVICE_REVOKED (the token''s Keycloak session belongs to a signed-out device)', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '429': { description: 'API_RATE_LIMITED, 120 reads a minute per account; details.retryAfterSeconds', headers: { Retry-After: { schema: { type: integer } } }, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '503': { $ref: '#/components/responses/Error' }
    delete:
      summary: Start account deletion (Doc 17 path)
      description: >-
        Requires the token's auth_time to be within the last 300 seconds and an Idempotency-Key. From this call the
        account is locked (every later call is 403 ACCOUNT_DELETING), every device is signed out, and a purge is queued
        (Keycloak user first, then local data). Poll GET /v1/account-deletions/{ticket}. Audited account.delete_requested.
        A retry with the same Idempotency-Key after a success gets 403 ACCOUNT_DELETING, not the ticket again
        (the sign-in check refuses the locked account before the replay).
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          description: 'Required on this path (428 IDEMPOTENCY_KEY_REQUIRED without it). 8-128 characters of A-Z a-z 0-9 _ . : -, e.g. a UUID.'
          schema: { type: string, pattern: '^[A-Za-z0-9_.:-]{8,128}$' }
      responses:
        '202':
          description: Deletion started. Keep the ticket; it is shown only once.
          headers:
            Cache-Control: { schema: { type: string, example: no-store } }
          content: { application/json: { schema: { $ref: '#/components/schemas/MeDeletionTicket' } } }
        '400': { description: 'VALIDATION_FAILED, details.field = Idempotency-Key (malformed key)', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '401': { description: 'AUTH_REQUIRED, or REAUTH_REQUIRED with details.maxAgeSeconds = 300', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '403': { description: 'ACCOUNT_DELETING (already requested), AUTH_FORBIDDEN or DEVICE_REVOKED', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '409': { description: 'IDEMPOTENCY_KEY_REUSED (same key, different request) or IDEMPOTENCY_IN_PROGRESS (Retry-After: 1)', headers: { Retry-After: { schema: { type: integer } } }, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '428': { description: 'IDEMPOTENCY_KEY_REQUIRED, details.header = Idempotency-Key', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '429': { description: 'API_RATE_LIMITED, 30 writes a minute per account; details.retryAfterSeconds', headers: { Retry-After: { schema: { type: integer } } }, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '503': { $ref: '#/components/responses/Error' }
  /v1/me/account:
    delete:
      summary: Start account deletion (older path, same as DELETE /v1/me)
      description: >-
        Same behaviour as DELETE /v1/me, except that Idempotency-Key is optional here (kept for app builds made before
        the key existed). Requires auth_time within the last 300 seconds.
      parameters:
        - { $ref: '#/components/parameters/IdempotencyKey' }
      responses:
        '202':
          description: Deletion started
          headers:
            Cache-Control: { schema: { type: string, example: no-store } }
            Idempotent-Replayed: { schema: { type: string, enum: ['true'] }, description: Only on a replay }
          content: { application/json: { schema: { $ref: '#/components/schemas/MeDeletionTicket' } } }
        '400': { description: 'VALIDATION_FAILED, details.field = Idempotency-Key (malformed key)', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '401': { description: 'AUTH_REQUIRED, or REAUTH_REQUIRED with details.maxAgeSeconds = 300', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '403': { description: 'ACCOUNT_DELETING (already requested), AUTH_FORBIDDEN or DEVICE_REVOKED', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '409': { description: 'IDEMPOTENCY_KEY_REUSED or IDEMPOTENCY_IN_PROGRESS (Retry-After: 1)', headers: { Retry-After: { schema: { type: integer } } }, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '429': { description: 'API_RATE_LIMITED, 30 writes a minute per account; details.retryAfterSeconds', headers: { Retry-After: { schema: { type: integer } } }, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '503': { $ref: '#/components/responses/Error' }
  /v1/account-deletions/{ticket}:
    get:
      summary: Public progress of an account deletion (no sign-in)
      description: Rate limited to 60 a minute per client address. Unknown, malformed and expired tickets are all 404. Tickets are kept 35 days after completion.
      security: []
      parameters:
        - { name: ticket, in: path, required: true, description: The ticket from DELETE /v1/me, schema: { type: string, pattern: '^[A-Za-z0-9_-]{43}$' } }
      responses:
        '200':
          description: Progress
          headers:
            Cache-Control: { schema: { type: string, example: no-store } }
          content: { application/json: { schema: { $ref: '#/components/schemas/MeDeletionStatus' } } }
        '404': { $ref: '#/components/responses/Error' }
        '429': { description: 'API_RATE_LIMITED, 60 a minute per client address; details.retryAfterSeconds', headers: { Retry-After: { schema: { type: integer } } }, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '503': { $ref: '#/components/responses/Error' }
  /v1/me/settings:
    get:
      summary: Read the signed-in account's settings
      responses:
        '200':
          description: Current settings. A new account gets defaults (system, th, allow) at revision 0.
          headers:
            ETag: { schema: { type: string, example: '"3"' }, description: Quoted revision }
            Cache-Control: { schema: { type: string, example: no-store } }
          content: { application/json: { schema: { $ref: '#/components/schemas/SettingsView' } } }
        '401': { $ref: '#/components/responses/Error' }
        '403': { description: 'ACCOUNT_DELETING, AUTH_FORBIDDEN or DEVICE_REVOKED', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '429': { description: 'API_RATE_LIMITED, 120 reads a minute per account; details.retryAfterSeconds', headers: { Retry-After: { schema: { type: integer } } }, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '503': { $ref: '#/components/responses/Error' }
    patch:
      summary: Change some settings (compare-and-set on revision)
      parameters:
        - name: If-Match
          in: header
          required: true
          description: The revision the client last read, quoted, e.g. "3". Use "0" before the first save. No weak tags, no wildcard.
          schema: { type: string, pattern: '^"\d{1,15}"$' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/SettingsPatch' } } }
      responses:
        '200':
          description: Saved; revision incremented by one
          headers:
            ETag: { schema: { type: string, example: '"4"' }, description: Quoted new revision }
            Cache-Control: { schema: { type: string, example: no-store } }
            Idempotent-Replayed: { schema: { type: string, enum: ['true'] }, description: Only on a replay }
          content: { application/json: { schema: { $ref: '#/components/schemas/SettingsView' } } }
        '400': { description: 'VALIDATION_FAILED: details.reason body_must_be_object, empty_patch, unknown_field, value_not_allowed (with field and allowed), malformed (field If-Match), malformed_body; or field Idempotency-Key', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '401': { $ref: '#/components/responses/Error' }
        '403': { description: 'ACCOUNT_DELETING, AUTH_FORBIDDEN or DEVICE_REVOKED', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '409': { description: 'IDEMPOTENCY_KEY_REUSED or IDEMPOTENCY_IN_PROGRESS (Retry-After: 1)', headers: { Retry-After: { schema: { type: integer } } }, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '412': { description: 'REVISION_MISMATCH, details.currentRevision', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '413': { description: PAYLOAD_TOO_LARGE (body over 16 KiB), content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '428': { description: PRECONDITION_REQUIRED (If-Match missing), content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '429': { description: 'API_RATE_LIMITED, 30 writes a minute per account; details.retryAfterSeconds', headers: { Retry-After: { schema: { type: integer } } }, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '503': { $ref: '#/components/responses/Error' }
  /v1/me/devices:
    get:
      summary: List the signed-in account's devices (cursor pages)
      parameters:
        - { name: cursor, in: query, schema: { type: string, pattern: '^[A-Za-z0-9_-]{1,1024}$' }, description: Opaque; from nextCursor }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 50 } }
      responses:
        '200':
          description: Devices, active first, then most recently seen, then by id; with the current settings revision and the server clock for comparison
          headers:
            Cache-Control: { schema: { type: string, example: no-store } }
          content: { application/json: { schema: { $ref: '#/components/schemas/DeviceList' } } }
        '400': { description: 'VALIDATION_FAILED: field limit (out_of_range, details.max) or cursor (malformed)', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '401': { $ref: '#/components/responses/Error' }
        '403': { description: 'ACCOUNT_DELETING, AUTH_FORBIDDEN or DEVICE_REVOKED', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '429': { description: 'API_RATE_LIMITED, 120 reads a minute per account; details.retryAfterSeconds', headers: { Retry-After: { schema: { type: integer } } }, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '503': { $ref: '#/components/responses/Error' }
  /v1/me/devices/{deviceId}:
    put:
      summary: Device check-in (registers on first call)
      description: >-
        Called by the app at sign-in and on each sync. Also records the token's Keycloak session id (sid) so a later
        sign-out from the web can end that session. deviceId must be an RFC 4122 UUID (version 1-8, variant 8-b), any case;
        it is stored lowercase. A late, older appliedSettingsRevision never moves the stored one backwards.
      parameters:
        - { $ref: '#/components/parameters/DeviceId' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/DeviceReport' } } }
      responses:
        '200':
          description: Recorded
          headers:
            Cache-Control: { schema: { type: string, example: no-store } }
            Idempotent-Replayed: { schema: { type: string, enum: ['true'] }, description: Only on a replay }
          content: { application/json: { schema: { $ref: '#/components/schemas/Device' } } }
        '400': { description: 'VALIDATION_FAILED: field deviceId (must_be_uuid), unknown_field, platform (value_not_allowed), osMajor (out_of_range), appBuild (malformed), appliedSettingsRevision (out_of_range, or ahead_of_server with details.settingsRevision), body_must_be_object; or field Idempotency-Key', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '401': { $ref: '#/components/responses/Error' }
        '403': { description: 'DEVICE_REVOKED (sign the app out; a revoked id never comes back, sign in again as a new device id), ACCOUNT_DELETING or AUTH_FORBIDDEN', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '409': { description: 'DEVICE_LIMIT, details.maxActiveDevices = 20 active devices per account; or IDEMPOTENCY_KEY_REUSED / IDEMPOTENCY_IN_PROGRESS (Retry-After: 1)', headers: { Retry-After: { schema: { type: integer } } }, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '413': { description: PAYLOAD_TOO_LARGE (body over 16 KiB), content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '429': { description: 'API_RATE_LIMITED, 30 writes a minute per account; details.retryAfterSeconds', headers: { Retry-After: { schema: { type: integer } } }, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '503': { $ref: '#/components/responses/Error' }
  /v1/me/devices/{deviceId}/session:
    delete:
      summary: Sign a device out (revoke it)
      description: >-
        Requires the token's auth_time to be within the last 300 seconds. The first revoke is audited as device.revoke;
        repeat calls keep the first revokedAt and write nothing. From then on any token carrying that device's Keycloak
        session id is refused (403 DEVICE_REVOKED) and the session is ended at Keycloak (retried in the background on failure).
        Another account's device id and an unknown id are both 404.
      parameters:
        - { $ref: '#/components/parameters/DeviceId' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      responses:
        '200':
          description: Revoked
          headers:
            Idempotent-Replayed: { schema: { type: string, enum: ['true'] }, description: Only on a replay }
            Cache-Control: { schema: { type: string, example: no-store } }
          content: { application/json: { schema: { $ref: '#/components/schemas/Device' } } }
        '400': { description: 'VALIDATION_FAILED, field deviceId (must_be_uuid) or Idempotency-Key', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '401': { description: 'AUTH_REQUIRED, or REAUTH_REQUIRED with details.maxAgeSeconds = 300', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '403': { description: 'ACCOUNT_DELETING, AUTH_FORBIDDEN or DEVICE_REVOKED', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '404': { $ref: '#/components/responses/Error' }
        '409': { description: 'IDEMPOTENCY_KEY_REUSED or IDEMPOTENCY_IN_PROGRESS (Retry-After: 1)', headers: { Retry-After: { schema: { type: integer } } }, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '429': { description: 'API_RATE_LIMITED, 30 writes a minute per account; details.retryAfterSeconds', headers: { Retry-After: { schema: { type: integer } } }, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '503': { $ref: '#/components/responses/Error' }
  /v1/me/devices/{deviceId}/preferences:
    parameters:
      - { $ref: '#/components/parameters/DeviceId' }
    get:
      summary: The device's own setting overrides and what it should apply (Doc 17 device_preferences)
      description: Only the owner's active devices. Another account's or an unknown device is 404; a revoked device is 403 DEVICE_REVOKED.
      responses:
        '200':
          description: Overrides at the device's preferences revision (0 until the first save)
          headers:
            ETag: { schema: { type: string, example: '"2"' }, description: Quoted preferences revision }
            Cache-Control: { schema: { type: string, example: no-store } }
          content: { application/json: { schema: { $ref: '#/components/schemas/MeDevicePreferences' } } }
        '400': { description: 'VALIDATION_FAILED, field deviceId (must_be_uuid)', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '401': { $ref: '#/components/responses/Error' }
        '403': { description: 'DEVICE_REVOKED (this device), ACCOUNT_DELETING or AUTH_FORBIDDEN', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '404': { $ref: '#/components/responses/Error' }
        '429': { description: 'API_RATE_LIMITED, 120 reads a minute per account; details.retryAfterSeconds', headers: { Retry-After: { schema: { type: integer } } }, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '503': { $ref: '#/components/responses/Error' }
    put:
      summary: Replace the device's overrides (compare-and-set on the device's preferences revision)
      description: 'The body is the full set for the device; `{"overrides": {}}` makes it follow the account again. Removed with the device.'
      parameters:
        - name: If-Match
          in: header
          required: true
          description: The device's preferences revision, quoted; "0" before the first save
          schema: { type: string, pattern: '^"\d{1,15}"$' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/MeDevicePreferencesPut' } } }
      responses:
        '200':
          description: Saved; preferences revision incremented by one (also when the overrides are unchanged)
          headers:
            ETag: { schema: { type: string }, description: Quoted new preferences revision }
            Cache-Control: { schema: { type: string, example: no-store } }
            Idempotent-Replayed: { schema: { type: string, enum: ['true'] }, description: Only on a replay }
          content: { application/json: { schema: { $ref: '#/components/schemas/MeDevicePreferences' } } }
        '400': { description: 'VALIDATION_FAILED: field deviceId (must_be_uuid), If-Match (malformed), overrides (must_be_object), unknown_field, value_not_allowed (with allowed); or field Idempotency-Key', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '401': { $ref: '#/components/responses/Error' }
        '403': { description: 'DEVICE_REVOKED (this device), ACCOUNT_DELETING or AUTH_FORBIDDEN', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '404': { $ref: '#/components/responses/Error' }
        '409': { description: 'IDEMPOTENCY_KEY_REUSED or IDEMPOTENCY_IN_PROGRESS (Retry-After: 1)', headers: { Retry-After: { schema: { type: integer } } }, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '412': { description: 'REVISION_MISMATCH, details.currentRevision', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '413': { description: PAYLOAD_TOO_LARGE (body over 16 KiB), content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '428': { description: PRECONDITION_REQUIRED (If-Match missing), content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '429': { description: 'API_RATE_LIMITED, 30 writes a minute per account; details.retryAfterSeconds', headers: { Retry-After: { schema: { type: integer } } }, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '503': { $ref: '#/components/responses/Error' }
  /v1/me/staff:
    get:
      summary: The caller's current staff roles, MFA state and roles version (for the console)
      description: Any signed-in account; customers get an empty list. Real enforcement stays on each /v1/admin route.
      responses:
        '200':
          description: Roles (empty for customers)
          headers:
            Cache-Control: { schema: { type: string, example: no-store } }
          content: { application/json: { schema: { $ref: '#/components/schemas/MeStaff' } } }
        '401': { $ref: '#/components/responses/Error' }
        '403': { description: 'ACCOUNT_DELETING, AUTH_FORBIDDEN or DEVICE_REVOKED', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '429': { description: 'API_RATE_LIMITED, 120 reads a minute per account; details.retryAfterSeconds', headers: { Retry-After: { schema: { type: integer } } }, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '503': { $ref: '#/components/responses/Error' }
  /v1/me/export:
    get:
      summary: The account's data built on the spot (legacy; new clients use POST /v1/me/exports)
      description: No recent sign-in needed. Audited account.export on every call. At most 10,000 diagnostic events (diagnosticsTruncated says when more exist).
      responses:
        '200':
          description: The export document, as a download
          headers:
            Cache-Control: { schema: { type: string, example: no-store } }
            Content-Disposition: { schema: { type: string, example: 'attachment; filename="tunedeck-export-2026-10-05.json"' } }
          content: { application/json: { schema: { $ref: '#/components/schemas/MeAccountExport' } } }
        '401': { $ref: '#/components/responses/Error' }
        '403': { description: 'ACCOUNT_DELETING, AUTH_FORBIDDEN or DEVICE_REVOKED', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '429': { description: 'API_RATE_LIMITED, 120 reads a minute per account; details.retryAfterSeconds', headers: { Retry-After: { schema: { type: integer } } }, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '503': { $ref: '#/components/responses/Error' }
  /v1/me/exports:
    post:
      summary: Start a background export of the account's data (Doc 17)
      description: >-
        Requires the token's auth_time to be within the last 300 seconds and an Idempotency-Key. While an export is
        being built, asking again returns that one. A build that fails is retried (1, 5, 15, 60 minutes) and after 5
        attempts reads as failed; ask again then. Exports are deleted 24 hours after the request. Audited account.export when built.
        No request body. Poll GET /v1/me/exports/{id}.
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          description: 'Required on this route (428 IDEMPOTENCY_KEY_REQUIRED without it). 8-128 characters of A-Z a-z 0-9 _ . : -, e.g. a UUID.'
          schema: { type: string, pattern: '^[A-Za-z0-9_.:-]{8,128}$' }
      responses:
        '202':
          description: The pending export (new, or the one already being built)
          headers:
            Cache-Control: { schema: { type: string, example: no-store } }
            Idempotent-Replayed: { schema: { type: string, enum: ['true'] }, description: Only on a replay (the body is the first answer, so its status may be stale) }
          content: { application/json: { schema: { $ref: '#/components/schemas/MeExport' } } }
        '400': { description: 'VALIDATION_FAILED, details.field = Idempotency-Key (malformed key)', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '401': { description: 'AUTH_REQUIRED, or REAUTH_REQUIRED with details.maxAgeSeconds = 300', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '403': { description: 'ACCOUNT_DELETING, AUTH_FORBIDDEN or DEVICE_REVOKED', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
